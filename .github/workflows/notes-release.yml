name: notes-release

# Reusable release pipeline for a latere.ai repository that builds nothing on
# a tag: a Go module, a library, a tool consumed through go.mod. A consumer
# repo calls this on a version tag push:
#
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     release:
#       uses: latere-ai/ci/.github/workflows/notes-release.yml@v1
#       secrets: inherit
#
# Flow (one run): check that the tagged commit passed CI -> read the tag's
# CHANGELOG.md section -> publish the GitHub release with that section as the
# body, through the shared verified-commit and publish-release steps under
# actions/, run from this workflow's own commit. A tag on a commit whose CI
# did not pass, or without a section, fails before anything is created. The
# caller grants contents: write and actions: read. See this repo's README for
# the changelog convention.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for the job. By default the organization's runner policy picks the label (README, Runners): a private repository runs on the self-hosted runner, or on ubuntu-latest while that runner is offline; a public one on ubuntu-latest, and never on the self-hosted runner for a pull request. A label passed here overrides the policy and its fallback."
        required: false
        type: string
        default: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
      title:
        description: "Optional release title prefix (e.g. Lux -> 'Lux v1.2.3'). Empty titles the release with the tag alone."
        required: false
        type: string
        default: ""
      go_version:
        description: "Go toolchain version, used to run the release-note reader."
        required: false
        type: string
        default: "1.27"
      lateregate_version:
        description: "latere-ai/ci-gate version whose `release-notes` reads the CHANGELOG.md section for the tag, rather than the consumer's tool pin, so the reader is the same in every repository, including ones that pin no Go tool. Empty takes the version in actions/lib/versions.sh."
        required: false
        type: string
        default: ""
      verify_workflow:
        description: "File name of the per-push workflow whose run on the tagged commit must have succeeded before the release is published. Empty takes the one workflow in .github/workflows that calls lateregate.yml."
        required: false
        type: string
        default: ""
      wait_minutes:
        description: "How long the release waits for that run while it is still going. 0 refuses at once."
        required: false
        type: string
        default: "60"
      skip_paths:
        description: "Shell patterns, one per line, for paths that change no code. A commit that changes only these carries its parent's code, so where its own verify run is missing, still going or cancelled, its parent is read instead; a run that concluded on the commit still decides. A repository whose verify workflow ignores more paths lists them here too."
        required: false
        type: string
        default: |
          specs/*
          *.md
      gh_version:
        description: "GitHub CLI release fetched for the CI check and the publish step when the runner has none, verified against its checksums file. Hosted runners ship gh and skip the fetch. Empty takes the version in actions/lib/versions.sh."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  # The CI check reads the verify workflow's runs on the tagged commit.
  actions: read

jobs:
  release:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: The shared steps, at this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .latere-ci
          sparse-checkout: actions
          persist-credentials: false
      - name: Keep the shared steps out of git status
        run: echo '/.latere-ci/' >> .git/info/exclude

      # Before anything is created: the tagged commit passed the
      # repository's per-push gate on its branch push. A tag on a commit
      # whose CI failed, was cancelled or never ran publishes nothing,
      # however the tag was pushed.
      - name: The tagged commit passed CI
        uses: ./.latere-ci/actions/verified-commit
        with:
          verify_workflow: ${{ inputs.verify_workflow }}
          wait_minutes: ${{ inputs.wait_minutes }}
          skip_paths: ${{ inputs.skip_paths }}
          gh_version: ${{ inputs.gh_version }}

      # A tag is a release, and a release has notes. The section for this
      # tag in CHANGELOG.md is the body, read by lateregate's note reader at
      # a version pinned in ci rather than the consumer's tool pin, so it
      # also serves repositories that pin no Go tool, and no section fails
      # the job before anything is created. A re-run edits the body to the
      # section as it stands at the tag. gh is fetched and verified where
      # the runner has none.
      - name: Publish the release
        uses: ./.latere-ci/actions/publish-release
        with:
          title: ${{ inputs.title }}
          lateregate_version: ${{ inputs.lateregate_version }}
          gh_version: ${{ inputs.gh_version }}
