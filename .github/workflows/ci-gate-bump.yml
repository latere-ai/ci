name: ci-gate-bump

# Reusable daily move of a Latere Go repository's gate pin to the latest
# latere.ai/x/ci-gate release. A consumer calls it on a schedule:
#
#   on:
#     schedule:
#       - cron: "17 3 * * *"
#     workflow_dispatch:
#   permissions:
#     contents: write
#     issues: write
#     actions: write
#   jobs:
#     bump:
#       uses: latere-ai/ci/.github/workflows/ci-gate-bump.yml@v1
#
# A repository pins ci-gate by exact version in its go.mod tool directive, so
# the hooks on a laptop and the per-push pipeline run the same `lateregate`.
# Running the gate at @latest in CI instead would split the two, and a pin
# only moves in a commit, so this workflow makes that commit: it moves the pin
# when the new release passes the repository's whole bar, and opens an issue
# naming the failing gates when it does not.
#
# The check job asks the module proxy whether a newer release exists and runs
# no gate, so a repository that is current costs one short job a day.

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go toolchain version. Keep it the one the repository's per-push gate runs, since govulncheck judges the standard library of the toolchain that runs it."
        required: false
        type: string
        default: "1.27"
      runs_on:
        description: "Runner for both jobs. ubuntu-latest by default; a private repository on the self-hosted runner passes linux-vm, the label its per-push gate runs on."
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  check:
    name: is the pin current
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      # Closing the issues a moved pin has resolved.
      issues: write
    outputs:
      current: ${{ steps.pin.outputs.current }}
      latest: ${{ steps.pin.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # This job builds nothing, so there is no module cache worth
          # restoring.
          cache: false
      # Keep in step with test/ci_gate_bump_test.sh, which runs a copy of this
      # shell against a stub go.
      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          # -u asks the proxy for the newest release above the pin, by the rule
          # `go get` applies: never a downgrade, and a prerelease only over a
          # pin that is one. It reports no update when it could not ask, so the
          # @latest query, which fails when the proxy does not answer, is what
          # makes "current" an answer rather than a lookup that never ran.
          pin=$(go list -m -u -f '{{.Version}} {{with .Update}}{{.Version}}{{end}}' latere.ai/x/ci-gate)
          read -r current update <<< "$pin"
          latest=$(go list -m -f '{{.Version}}' latere.ai/x/ci-gate@latest)
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          for v in "$current" "$latest" ${update:+"$update"}; do
            if ! printf '%s' "$v" | grep -Eq "$semver"; then
              echo "::error::go list answered '$v' for latere.ai/x/ci-gate, which is not a release version"
              exit 1
            fi
          done
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -z "$update" ]; then
            echo "latere.ai/x/ci-gate is pinned at $current; the latest release is $latest. Nothing to move." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "latest=$update" >> "$GITHUB_OUTPUT"
          echo "latere.ai/x/ci-gate is pinned at $current and $update is out; the bump job runs the bar on it." >> "$GITHUB_STEP_SUMMARY"
      # An issue this workflow opened for a version the pin has reached, by
      # this workflow or by hand, is closed here, so a fixed tree leaves no
      # issue behind. Keep in step with test/ci_gate_bump_test.sh.
      - name: Close the issues the pin has resolved
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.pin.outputs.current }}
        run: |
          set -euo pipefail
          api() {
            curl -sS --fail-with-body -X "$1" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/$2" ${3:+--data "$3"}
          }
          open=$(api GET "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100")
          printf '%s' "$open" | jq -r '.[] | select(.pull_request == null) | "\(.number) \(.title)"' |
          while read -r number title; do
            case "$title" in
              "ci-gate v"*" does not pass the gate") ;;
              *) continue ;;
            esac
            version=${title#ci-gate }
            version=${version%% *}
            # The issue is resolved when its version is not newer than the pin.
            if [ "$(printf '%s\n%s\n' "$version" "$CURRENT" | sort -V | tail -n 1)" != "$CURRENT" ]; then
              continue
            fi
            api POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              "$(jq -nc --arg v "$CURRENT" '{body: "The pin is at \($v), which passed the bar when it moved. Closing."}')" >/dev/null
            api PATCH "repos/$GITHUB_REPOSITORY/issues/$number" '{"state":"closed","state_reason":"completed"}' >/dev/null
            echo "closed #$number: $title"
          done

  bump:
    name: bump to ${{ needs.check.outputs.latest }}
    needs: check
    if: ${{ needs.check.outputs.latest != '' }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      # The pin commit.
      contents: write
      # The issue when the new release does not pass.
      issues: write
      # Dispatching the per-push gate on the new commit.
      actions: write
    # The schedule and a manual run must not race each other to the push.
    concurrency:
      group: ci-gate-bump-${{ github.repository }}
      cancel-in-progress: false
    env:
      CURRENT: ${{ needs.check.outputs.current }}
      LATEST: ${{ needs.check.outputs.latest }}
      # A self-hosted runner keeps one Go build and test cache for all of its
      # runner processes, and without -trimpath the cache keys a package on
      # the directory it was built in, so the bar here would replay nothing
      # the per-push gate recorded. See lateregate.yml.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    steps:
      # No credential stays in .git/config while the new release and the
      # repository's tests run. The push step hands git the token itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
      # Every step that can find the release wanting writes the name of what
      # failed to $LOGS/failed and its output to $LOGS/<name>.log, which the
      # issue step reads. Keep in step with test/ci_gate_bump_test.sh.
      - name: Move the pin
        id: move
        run: |
          set -uo pipefail
          logs="$RUNNER_TEMP/ci-gate-bump"
          mkdir -p "$logs"
          echo "logs=$logs" >> "$GITHUB_OUTPUT"
          directives() { go mod edit -json | jq -r '"go \(.Go // "none"), toolchain \(.Toolchain // "none")"'; }
          before=$(directives)
          if ! { go get -tool "latere.ai/x/ci-gate/cmd/lateregate@$LATEST" && go mod tidy; } > "$logs/pin.log" 2>&1; then
            cat "$logs/pin.log"
            echo pin >> "$logs/failed"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$logs/pin.log"
          # A release that needs a newer Go would raise the repository's go or
          # toolchain line in the same commit. Which Go a repository builds
          # with is its own decision, so that is reported, not pushed.
          after=$(directives)
          if [ "$before" != "$after" ]; then
            echo "moving the pin to $LATEST changes go.mod from $before to $after; raise the Go version by hand first" | tee -a "$logs/pin.log"
            echo pin >> "$logs/failed"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat
          echo "moved=true" >> "$GITHUB_OUTPUT"
      - name: Read the plan
        id: plan
        if: ${{ steps.move.outputs.moved == 'true' }}
        env:
          LOGS: ${{ steps.move.outputs.logs }}
        run: |
          set -uo pipefail
          if ! go tool lateregate list -json > "$LOGS/plan.json" 2> "$LOGS/plan.log"; then
            cat "$LOGS/plan.log"
            echo plan >> "$LOGS/failed"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.[] | "\(.status)\t\(.name)\t\(.reason // "")"' "$LOGS/plan.json"
          {
            echo "gates=$(jq -c '[.[] | select(.status == "run") | .name]' "$LOGS/plan.json")"
            echo "enum_typescript=$(jq -r '[.[] | select(.status == "run" and .name == "enum-typescript")] | length > 0' "$LOGS/plan.json")"
            echo "ok=true"
          } >> "$GITHUB_OUTPUT"
      # Enum checking resolves each configured project's TypeScript compiler,
      # as in lateregate.yml; Go gates need no JavaScript runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.plan.outputs.enum_typescript == 'true' }}
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ steps.plan.outputs.enum_typescript == 'true' }}
        with:
          bun-version: "1.3.14"
      - name: Prepare TypeScript enum projects
        if: ${{ steps.plan.outputs.enum_typescript == 'true' }}
        run: go tool lateregate enum-typescript-prepare
      # The whole bar: every gate the plan runs, in its order, which is what
      # `go tool lateregate` runs, then the wiring check. Each runs whether
      # another failed, so the issue names every gate the release trips. Run
      # one by one rather than as one process for the reason lateregate.yml
      # gives: lint alone gets the runner process's own TMPDIR, since
      # golangci-lint locks a file under TMPDIR for the whole machine and a
      # lint in another runner slot would fail this one, while every other
      # gate keeps the machine's TMPDIR and replays the per-push test cache.
      - name: Run the bar
        id: bar
        if: ${{ steps.plan.outputs.ok == 'true' }}
        env:
          GATES: ${{ steps.plan.outputs.gates }}
          LOGS: ${{ steps.move.outputs.logs }}
        run: |
          set -uo pipefail
          failed=""
          for gate in $(printf '%s' "$GATES" | jq -r '.[]') contract; do
            echo "::group::$gate"
            if [ "$gate" = lint ]; then
              TMPDIR="$RUNNER_TEMP" go tool lateregate lint 2>&1 | tee "$LOGS/$gate.log" || failed="$failed $gate"
            else
              go tool lateregate "$gate" 2>&1 | tee "$LOGS/$gate.log" || failed="$failed $gate"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            for gate in $failed; do
              echo "$gate" >> "$LOGS/failed"
              echo "::warning title=$gate::go tool lateregate $gate fails on $LATEST; its output is in the $gate group above"
            done
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push made with the job's token starts no workflow, so the commit is
      # pushed here and its per-push run is dispatched below.
      - name: Push the pin
        id: push
        if: ${{ steps.bar.outputs.passed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${header#AUTHORIZATION: basic }"
          remote() { git -c "http.$GITHUB_SERVER_URL/.extraheader=$header" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message="gate: ci-gate $LATEST"
          git add go.mod go.sum
          git commit -q -m "$message"
          attempts=3
          for attempt in $(seq "$attempts"); do
            if remote push origin "HEAD:refs/heads/$BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Moved latere.ai/x/ci-gate from $CURRENT to $LATEST in $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            # The branch moved while the bar ran. Replay the pin on its new tip;
            # the per-push run dispatched after the push checks the result.
            remote fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            if ! git rebase -q "origin/$BRANCH"; then
              # The new commits touched go.mod or go.sum. Take them and move
              # the pin again on top.
              git rebase --abort
              git reset -q --hard "origin/$BRANCH"
              go get -tool "latere.ai/x/ci-gate/cmd/lateregate@$LATEST"
              go mod tidy
              git add go.mod go.sum
              if ! git diff --cached --quiet; then
                git commit -q -m "$message"
              fi
            fi
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" ]; then
              echo "$BRANCH already pins latere.ai/x/ci-gate $LATEST; nothing to push." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::the push to $BRANCH was rejected $attempts times; the pin is not moved and the next run tries again"
          exit 1
      - name: Run the per-push gate on the new commit
        if: ${{ steps.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The caller of the per-push gate: `lateregate contract` holds a
          # repository to exactly one. `lateregate release` refuses to cut
          # while it cannot read green CI, so the new commit gets its run.
          callers=$(grep -lF 'latere-ai/ci/.github/workflows/lateregate.yml@v1' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true)
          if [ "$(printf '%s' "$callers" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one workflow calling lateregate.yml under .github/workflows, found: ${callers:-none}"
            exit 1
          fi
          if ! grep -Eq '^  workflow_dispatch:' "$callers"; then
            echo "::error file=$callers::$callers has no workflow_dispatch trigger, so the pin commit gets no CI run; add 'workflow_dispatch:' under its 'on:'"
            exit 1
          fi
          workflow=$(basename "$callers")
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
            --data "$(jq -nc --arg ref "$BRANCH" '{ref: $ref}')"
          echo "Dispatched $workflow on $BRANCH: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/$workflow" >> "$GITHUB_STEP_SUMMARY"
      # A release that does not pass is a finding for the repository, not a
      # failed run: `lateregate release` refuses to cut while the latest run
      # of any workflow on the branch is red, and a red run here would stay
      # red every day until the tree is fixed, holding back releases the old
      # pin still verifies. The run stays green and the issue carries it.
      - name: Open or update the issue
        if: ${{ steps.move.outputs.failed == 'true' || steps.plan.outputs.failed == 'true' || steps.bar.outputs.failed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOGS: ${{ steps.move.outputs.logs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          api() {
            curl -sS --fail-with-body -X "$1" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/$2" ${3:+--data "$3"}
          }
          title="ci-gate $LATEST does not pass the gate"
          failed=$(sed '/^$/d' "$LOGS/failed")
          names=""
          for name in $failed; do
            names="${names:+$names, }\`$name\`"
          done
          # GitHub caps an issue body at 65536 characters; the logs share what
          # the prose leaves, each keeping its tail, where a gate's verdict is.
          budget=$((56000 / $(printf '%s\n' "$failed" | grep -c .)))
          body="$RUNNER_TEMP/ci-gate-bump-issue.md"
          {
            echo "The daily bump tried \`latere.ai/x/ci-gate\` $LATEST, and this repository does not pass it: $names. The pin stays at $CURRENT and nothing was pushed."
            echo
            echo "- What changed in $LATEST: https://github.com/latere-ai/ci-gate/releases/tag/$LATEST"
            echo "- The run: $RUN_URL"
            echo
            echo "To reproduce:"
            echo
            echo '```sh'
            echo "go get -tool latere.ai/x/ci-gate/cmd/lateregate@$LATEST"
            echo "go mod tidy"
            echo "go tool lateregate"
            echo '```'
            echo
            echo "Fix the tree, with or without the pin in the same commit. The next daily run moves the pin once the bar passes, and this issue closes when the pin reaches $LATEST. Until then every run that still fails updates it."
            for name in $failed; do
              case "$name" in
                pin) what="moving the pin (go get, go mod tidy)" ;;
                plan) what="reading the plan (go tool lateregate list)" ;;
                *) what="go tool lateregate $name" ;;
              esac
              echo
              echo "<details><summary>$what</summary>"
              echo
              echo '````'
              tail -n 200 "$LOGS/$name.log" 2>/dev/null | tail -c "$budget"
              echo '````'
              echo
              echo "</details>"
            done
          } > "$body"
          existing=$(api GET "repos/$GITHUB_REPOSITORY/issues?state=all&creator=github-actions%5Bbot%5D&per_page=100" |
            jq -r --arg t "$title" '[.[] | select(.pull_request == null and .title == $t)][0] // empty | "\(.number) \(.state)"')
          if [ -z "$existing" ]; then
            number=$(api POST "repos/$GITHUB_REPOSITORY/issues" \
              "$(jq -nc --arg t "$title" --rawfile b "$body" '{title: $t, body: $b}')" | jq -r .number)
            verb=opened
          else
            # The body is refreshed and the state left alone: a person who
            # closed the version's issue decided about it, and a daily reopen
            # would overrule them.
            number=${existing%% *}
            api PATCH "repos/$GITHUB_REPOSITORY/issues/$number" \
              "$(jq -nc --rawfile b "$body" '{body: $b}')" >/dev/null
            verb=updated
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
          echo "::warning title=ci-gate $LATEST does not pass::$names; $verb $url"
          echo "latere.ai/x/ci-gate $LATEST does not pass: $names. The pin stays at $CURRENT; $verb $url" >> "$GITHUB_STEP_SUMMARY"
