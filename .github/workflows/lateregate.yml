name: lateregate

# Reusable per-push pipeline for a latere.ai Go repo, with nothing in it but
# the shared bar. A consumer repo calls this on every push and pull request:
#
#   on: { push: { branches: [main] }, pull_request: {} }
#   jobs:
#     gate:
#       uses: latere-ai/ci/.github/workflows/lateregate.yml, at the @v1 tag
#
# Every gate lives in latere-ai/ci-gate, pinned by the consumer's go.mod as a
# tool dependency, so it runs identically on a laptop. This workflow asks the
# binary which gates apply (`lateregate list -json`) and runs exactly those,
# so a repository adopts a gate by pinning a version that has it, not by
# editing YAML here or a Makefile there. A hosted runner gives each gate a
# job of its own; the self-hosted runner runs all of them in one job. A
# waived or inapplicable gate does not run, and its reason is in the plan's
# log rather than a green step over nothing.
#
# The plan is measured from the last green commit: the job asks the binary
# for that base (`lateregate base -since green`) and lists the plan from it,
# so a push runs only the gates whose inputs changed. When the base cannot be
# had, because the pin predates the command, no run was green, or the caller
# grants no `actions: read`, the whole tree is checked and the log says why.
# What a gate installs (Node, Bun, a browser) and which systems `test` runs on
# also come from the plan, and the module that pins the tool is found by its
# `tool` line, so a caller passes no inputs.
#
# There is no golangci-lint version input: the binary pins it. There is no
# run_lint input: a repository that cannot lint waives `lint` in its
# .lateregate.yaml with a reason and a date, and the plan reads that.

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go toolchain version."
        required: false
        type: string
        default: "1.27"
      test_os:
        description: "Superseded by `test.os` in .lateregate.yaml, which the plan carries; used only when the plan has no os. JSON array of runners for the test job. Empty means the runner runs_on resolves to: every service deploys on Linux, and macOS bills at ten times the Linux rate. A repository with darwin build tags or a macOS artifact lists macos-latest here; the suite already covers the runs_on runner."
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner for every job except the test matrix: the probe, the gates and the wiring check. By default the organization's runner policy picks the label (README, Runners): a private repository runs on the self-hosted runner, or on ubuntu-latest while that runner is offline; a public one on ubuntu-latest, and never on the self-hosted runner for a pull request. A label passed here overrides the policy and its fallback."
        required: false
        type: string
        default: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
      gate_module:
        description: "Superseded by auto-detection, which finds the module whose go.mod has the tool line; a value here wins over it. Directory of the Go module whose go.mod pins latere.ai/x/ci-gate as a tool, relative to the repository root. A module that keeps the tool out of its consumers' module graph pins it in a nested module instead (managed-agents: internal/gate); lateregate runs from there and its gates still check the whole repository."
        required: false
        type: string
        default: ""
      frontend_browser_package:
        description: "Superseded by `frontend.browser` in .lateregate.yaml, which the plan carries as a need; used only when the plan carries no needs. Directory of a Bun package whose tests drive Chromium. Before the frontend gate, the package is installed there and Playwright installs Chromium with its system libraries. Empty installs no browser."
        required: false
        type: string
        default: ""

# actions: read lets the plan name the last green run. A caller that grants
# only contents: read caps this, the API answers 403, and the run checks the
# whole tree.
permissions:
  contents: read
  actions: read

# Every job runs lateregate from the module that pins it, pointed at the
# repository root with -C, so a nested gate module checks the same tree a
# root pin does. Each job finds that module once, in its Find the gate module
# step, which exports GATE_MODULE.

jobs:
  # The plan. Its outputs are the job sets, so the jobs are exactly the gates
  # the binary will run. On a self-hosted runner the all gates passed job
  # reads the plan itself, and the probe runs only when test_os names a
  # system other than runs_on, to give the test matrix its legs.
  probe:
    name: which gates apply
    if: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') || ((inputs.test_os || format('["{0}"]', inputs.runs_on)) != format('["{0}"]', inputs.runs_on)) }}
    runs-on: ${{ inputs.runs_on }}
    env:
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    outputs:
      # The last green commit the plan was measured from; empty when the whole
      # tree was checked.
      base: ${{ steps.plan.outputs.base }}
      gates: ${{ steps.plan.outputs.gates }}
      gate_needs: ${{ steps.plan.outputs.gate_needs }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against repositories of each shape.
      - name: Find the gate module
        env:
          GATE_INPUT: ${{ inputs.gate_module }}
        run: |
          set -euo pipefail
          # A go.mod pins the tool with a line `tool <path>` or a path inside a
          # `tool ( ... )` block.
          pins_tool() {
            awk '
              /^[[:space:]]*tool[[:space:]]*\(/ { block = 1; next }
              block && /^[[:space:]]*\)/ { block = 0; next }
              block && $1 == "latere.ai/x/ci-gate/cmd/lateregate" { found = 1 }
              /^[[:space:]]*tool[[:space:]]+latere\.ai\/x\/ci-gate\/cmd\/lateregate/ { found = 1 }
              END { exit !found }
            ' "$1"
          }
          module=.
          if [ -n "$GATE_INPUT" ]; then
            module=$GATE_INPUT
          else
            cd "$GITHUB_WORKSPACE"
            if [ -f go.mod ] && pins_tool go.mod; then
              module=.
            else
              found=""
              count=0
              while IFS= read -r mod; do
                case "$mod" in go.mod | */go.mod) ;; *) continue ;; esac
                if pins_tool "$mod"; then
                  found=$(dirname "$mod")
                  count=$((count + 1))
                fi
              done < <(git ls-files '*go.mod' 'go.mod')
              if [ "$count" -gt 1 ]; then
                echo "::error title=gate module::more than one go.mod pins the tool; set gate_module to the one lateregate runs from"
                exit 1
              fi
              if [ "$count" -eq 1 ]; then module=$found; fi
            fi
          fi
          echo "lateregate runs from the module in $module"
          echo "GATE_MODULE=$module" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ runner.environment == 'github-hosted' }}
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against canned plans.
      - name: Read the plan
        id: plan
        env:
          HOSTED: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
          RUNS_ON: ${{ inputs.runs_on }}
          TEST_OS: ${{ inputs.test_os || format('["{0}"]', inputs.runs_on) }}
          BROWSER: ${{ inputs.frontend_browser_package }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::cannot write the step summary"
          }
          # The plan is measured from the last green commit. lateregate base
          # prints that commit, or nothing when the whole tree must be checked
          # and the reason on stderr. A pin that predates the command exits
          # non-zero, and so does an API or fetch error; each checks the whole
          # tree and says why, so a push is never judged on less than the bar.
          err=$(mktemp)
          base=""
          failed=false
          if out=$(go -C "$GATE_MODULE" tool lateregate base -since green -C "$GITHUB_WORKSPACE" 2>"$err"); then
            base=$(printf '%s' "$out" | tr -d '[:space:]')
          else
            failed=true
          fi
          why=$(tr '\n' ' ' < "$err" | sed 's/ *$//')
          if [ -n "$base" ]; then
            echo "The plan is measured from the last green commit $base"
            summary "The plan is measured from the last green commit $base"
            plan=$(go -C "$GATE_MODULE" tool lateregate list -json -since "$base" -C "$GITHUB_WORKSPACE")
          else
            if [ "$failed" = true ]; then
              why="lateregate base failed: ${why:-no output}"
            fi
            echo "The whole tree is checked: ${why:-no last green commit}"
            summary "The whole tree is checked: ${why:-no last green commit}"
            plan=$(go -C "$GATE_MODULE" tool lateregate list -json -C "$GITHUB_WORKSPACE")
          fi
          printf '%s\n' "$plan" | jq -r '.[] | "\(.status)\t\(.name)\t\(.reason // "")\(.until // "" | if . == "" then "" else " until " + . end)\(.into // "" | if . == "" then "" else "into " + . end)"'
          # A pin that predates needs says nothing about what a gate installs,
          # so the gates that always needed Node and Bun get them, and the
          # frontend gets the browser package the caller names.
          plan=$(printf '%s\n' "$plan" | jq -c --arg browser "$BROWSER" '
            if any(.[]; has("needs")) then .
            else map(if .name == "enum-typescript" or .name == "frontend"
              then .needs = ["node", "bun"] + (if .name == "frontend" and $browser != "" then ["chromium:" + $browser] else [] end)
              else . end)
            end')
          # A hosted runner gives every gate a job of its own, side by side. On
          # the self-hosted runner a job is a turn on one of a few runner slots,
          # so the all gates passed job runs every gate itself and none gets a
          # job here.
          if [ "$HOSTED" = true ]; then
            gates=$(printf '%s\n' "$plan" | jq -c '[.[] | select(.status == "run" and .name != "test") | .name]')
          else
            gates='[]'
          fi
          # What each gate job installs, by gate name.
          gate_needs=$(printf '%s\n' "$plan" | jq -c '[.[] | select(.status == "run") | {key: .name, value: (.needs // [])}] | from_entries')
          # The test entry carries the systems test runs on; without them the
          # caller's test_os decides.
          plan_os=$(printf '%s\n' "$plan" | jq -c '[.[] | select(.name == "test" and ((.os // []) | length) > 0)][0].os // empty')
          if [ -n "$plan_os" ]; then
            TEST_OS=$plan_os
          fi
          # test has its own OS matrix. When suite runs, it carries the test run on
          # runs_on, so the matrix keeps only the other systems, and they run plain
          # test rather than the instrumented suite. On the self-hosted runner the
          # all gates passed job also runs plain test on runs_on when the plan has
          # it, so there too the matrix keeps only the other systems.
          suite=$(printf '%s\n' "$plan" | jq -r '[.[] | select(.status == "run" and .name == "suite")] | length > 0')
          test=$(printf '%s\n' "$plan" | jq -r '[.[] | select(.status == "run" and .name == "test")] | length > 0')
          if [ "$suite" = true ] || { [ "$HOSTED" != true ] && [ "$test" = true ]; }; then
            tests=$(jq -nc --argjson os "$TEST_OS" --arg on "$RUNS_ON" '[$os[] | select(. != $on)]')
          elif [ "$test" = true ]; then
            tests=$(jq -nc --argjson os "$TEST_OS" '$os')
          else
            tests='[]'
          fi
          {
            echo "base=$base"
            echo "gates=$gates"
            echo "gate_needs=$gate_needs"
            echo "tests=$tests"
          } >> "$GITHUB_OUTPUT"

  test:
    name: test on ${{ matrix.os }}
    needs: probe
    if: ${{ needs.probe.outputs.tests != '[]' }}
    runs-on: ${{ matrix.os }}
    env:
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-') || startsWith(matrix.os, 'windows-')) && '-trimpath' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.probe.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against repositories of each shape.
      - name: Find the gate module
        env:
          GATE_INPUT: ${{ inputs.gate_module }}
        run: |
          set -euo pipefail
          # A go.mod pins the tool with a line `tool <path>` or a path inside a
          # `tool ( ... )` block.
          pins_tool() {
            awk '
              /^[[:space:]]*tool[[:space:]]*\(/ { block = 1; next }
              block && /^[[:space:]]*\)/ { block = 0; next }
              block && $1 == "latere.ai/x/ci-gate/cmd/lateregate" { found = 1 }
              /^[[:space:]]*tool[[:space:]]+latere\.ai\/x\/ci-gate\/cmd\/lateregate/ { found = 1 }
              END { exit !found }
            ' "$1"
          }
          module=.
          if [ -n "$GATE_INPUT" ]; then
            module=$GATE_INPUT
          else
            cd "$GITHUB_WORKSPACE"
            if [ -f go.mod ] && pins_tool go.mod; then
              module=.
            else
              found=""
              count=0
              while IFS= read -r mod; do
                case "$mod" in go.mod | */go.mod) ;; *) continue ;; esac
                if pins_tool "$mod"; then
                  found=$(dirname "$mod")
                  count=$((count + 1))
                fi
              done < <(git ls-files '*go.mod' 'go.mod')
              if [ "$count" -gt 1 ]; then
                echo "::error title=gate module::more than one go.mod pins the tool; set gate_module to the one lateregate runs from"
                exit 1
              fi
              if [ "$count" -eq 1 ]; then module=$found; fi
            fi
          fi
          echo "lateregate runs from the module in $module"
          echo "GATE_MODULE=$module" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: go -C "$GATE_MODULE" tool lateregate test -C "$GITHUB_WORKSPACE"

  # One job per gate on a hosted runner, named for it, so a failure names
  # itself in the checks list and the slow gates run beside each other. The
  # probe gives this job no gate on the self-hosted runner.
  gate:
    name: ${{ matrix.gate }}
    needs: probe
    if: ${{ needs.probe.outputs.gates != '[]' }}
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.probe.outputs.gates) }}
    env:
      # A self-hosted runner keeps one Go build and test cache for all of its
      # runner processes, and without -trimpath the cache keys a package on
      # the directory it was built in. Each process checks out under a work
      # directory of its own, so none would replay a result another recorded.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against repositories of each shape.
      - name: Find the gate module
        env:
          GATE_INPUT: ${{ inputs.gate_module }}
        run: |
          set -euo pipefail
          # A go.mod pins the tool with a line `tool <path>` or a path inside a
          # `tool ( ... )` block.
          pins_tool() {
            awk '
              /^[[:space:]]*tool[[:space:]]*\(/ { block = 1; next }
              block && /^[[:space:]]*\)/ { block = 0; next }
              block && $1 == "latere.ai/x/ci-gate/cmd/lateregate" { found = 1 }
              /^[[:space:]]*tool[[:space:]]+latere\.ai\/x\/ci-gate\/cmd\/lateregate/ { found = 1 }
              END { exit !found }
            ' "$1"
          }
          module=.
          if [ -n "$GATE_INPUT" ]; then
            module=$GATE_INPUT
          else
            cd "$GITHUB_WORKSPACE"
            if [ -f go.mod ] && pins_tool go.mod; then
              module=.
            else
              found=""
              count=0
              while IFS= read -r mod; do
                case "$mod" in go.mod | */go.mod) ;; *) continue ;; esac
                if pins_tool "$mod"; then
                  found=$(dirname "$mod")
                  count=$((count + 1))
                fi
              done < <(git ls-files '*go.mod' 'go.mod')
              if [ "$count" -gt 1 ]; then
                echo "::error title=gate module::more than one go.mod pins the tool; set gate_module to the one lateregate runs from"
                exit 1
              fi
              if [ "$count" -eq 1 ]; then module=$found; fi
            fi
          fi
          echo "lateregate runs from the module in $module"
          echo "GATE_MODULE=$module" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ runner.environment == 'github-hosted' }}
      # A gate installs what the plan says it needs: Node and Bun for enum
      # checking and the frontend gate, which install and build each named Bun
      # package. Enum checking also prepares its committed lockfile first. Go
      # gates need neither a JavaScript runtime nor an install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ contains(fromJSON(needs.probe.outputs.gate_needs)[matrix.gate] || fromJSON('[]'), 'node') }}
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ contains(fromJSON(needs.probe.outputs.gate_needs)[matrix.gate] || fromJSON('[]'), 'bun') }}
        with:
          bun-version: "1.4.4"
        # bun goes to $HOME/.bun/bin. Runner slots on one machine share a
        # HOME, and a job executing bun while another slot extracts it
        # fails with ETXTBSY, so each job installs into its own temp dir.
        env:
          HOME: ${{ runner.temp }}
      # A failed install is not its own failure: the frontend gate then fails
      # on the test that needs the browser, and the other gates still report.
      # Keep in step with test/lateregate_test.sh, which runs a copy of this
      # shell against stub tools.
      - name: Install the browsers a frontend's tests drive
        if: ${{ contains(toJSON(fromJSON(needs.probe.outputs.gate_needs)[matrix.gate]), 'chromium:') }}
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(fromJSON(needs.probe.outputs.gate_needs)[matrix.gate]) }}
        run: |
          set -uo pipefail
          failed=0
          dirs=$(printf '%s\n' "$NEEDS" | jq -r '(. // [])[] | select(startswith("chromium:")) | sub("^chromium:"; "")') || exit 1
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::chromium for $dir"
            (cd "$GITHUB_WORKSPACE/$dir" && bun install --frozen-lockfile && bunx playwright install --with-deps chromium) || failed=1
            echo "::endgroup::"
          done <<< "$dirs"
          exit "$failed"
      - name: Prepare TypeScript enum projects
        if: ${{ matrix.gate == 'enum-typescript' }}
        run: go -C "$GATE_MODULE" tool lateregate enum-typescript-prepare -C "$GITHUB_WORKSPACE"
      # Every gate but lint keeps the machine's TMPDIR. A cached test result is
      # keyed on the TMPDIR the test read, and a value per runner process
      # would keep each process from replaying what another recorded.
      # The base the probe resolved, when it has one: a gate that holds parts
      # of its own, such as e2e's suites, skips the parts the change cannot
      # reach. An empty base passes no flag, which an older pin also takes.
      - run: go -C "$GATE_MODULE" tool lateregate ${{ matrix.gate }} -C "$GITHUB_WORKSPACE" ${BASE:+-since "$BASE"}
        if: ${{ matrix.gate != 'lint' }}
        env:
          BASE: ${{ needs.probe.outputs.base }}
      # golangci-lint locks a file under TMPDIR for the whole machine, so lint
      # gets the runner process's own directory and two of them do not collide.
      - run: go -C "$GATE_MODULE" tool lateregate lint -C "$GITHUB_WORKSPACE" ${BASE:+-since "$BASE"}
        if: ${{ matrix.gate == 'lint' }}
        env:
          TMPDIR: ${{ runner.temp }}
          BASE: ${{ needs.probe.outputs.base }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && (matrix.gate == 'cover' || matrix.gate == 'suite') }}
        # Coverage remains a required gate; this report copy is optional.
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          # 7 days. Long enough to re-run a failed release or pull the file
          # while it still matters, short enough that the store does not fill:
          # lectio's hit its quota holding 284 artifacts at the 90-day default.
          retention-days: 7

  # The wiring check: caller, hook, gitignore, pin, no hand-rolled gate
  # target. It runs whether or not a gate fails, because the two call for
  # different work. On the self-hosted runner it runs last in the all gates
  # passed job.
  contract:
    name: wiring is in shape
    if: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
    runs-on: ${{ inputs.runs_on }}
    env:
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against repositories of each shape.
      - name: Find the gate module
        env:
          GATE_INPUT: ${{ inputs.gate_module }}
        run: |
          set -euo pipefail
          # A go.mod pins the tool with a line `tool <path>` or a path inside a
          # `tool ( ... )` block.
          pins_tool() {
            awk '
              /^[[:space:]]*tool[[:space:]]*\(/ { block = 1; next }
              block && /^[[:space:]]*\)/ { block = 0; next }
              block && $1 == "latere.ai/x/ci-gate/cmd/lateregate" { found = 1 }
              /^[[:space:]]*tool[[:space:]]+latere\.ai\/x\/ci-gate\/cmd\/lateregate/ { found = 1 }
              END { exit !found }
            ' "$1"
          }
          module=.
          if [ -n "$GATE_INPUT" ]; then
            module=$GATE_INPUT
          else
            cd "$GITHUB_WORKSPACE"
            if [ -f go.mod ] && pins_tool go.mod; then
              module=.
            else
              found=""
              count=0
              while IFS= read -r mod; do
                case "$mod" in go.mod | */go.mod) ;; *) continue ;; esac
                if pins_tool "$mod"; then
                  found=$(dirname "$mod")
                  count=$((count + 1))
                fi
              done < <(git ls-files '*go.mod' 'go.mod')
              if [ "$count" -gt 1 ]; then
                echo "::error title=gate module::more than one go.mod pins the tool; set gate_module to the one lateregate runs from"
                exit 1
              fi
              if [ "$count" -eq 1 ]; then module=$found; fi
            fi
          fi
          echo "lateregate runs from the module in $module"
          echo "GATE_MODULE=$module" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: go -C "$GATE_MODULE" tool lateregate contract -C "$GITHUB_WORKSPACE"

  # The one status check branch protection requires. The gate jobs come and
  # go with the plan and are named for gates, so requiring them one by one
  # breaks each time a pin adds or drops a gate; this job is always there
  # under one name. It runs whatever happened above and passes only when
  # every job it needs succeeded or was skipped because it did not apply.
  #
  # On the self-hosted runner it is also the whole bar. A job there is a turn
  # on one of a few runner slots, and with every slot busy each job a run
  # adds is one more wait in the queue: a probe, then gate jobs, then this
  # check made three waits per push. So here this job reads the plan itself
  # and runs every gate one after another, the wiring check last. Each gate
  # runs whether another failed, has a group of its own in the log, a row in
  # the step summary, and an annotation if it fails. Only a test_os that
  # names another system brings back the probe and the test matrix, and this
  # job then waits for them.
  #
  # A cancelled run cancels this job, except a pull request run on a hosted
  # runner, which branch protection reads: there the job runs and fails. A
  # push run is cancelled when a newer push to the ref supersedes it through
  # the caller's concurrency group, or when GitHub delivers one push twice,
  # and its conclusion already says so. On the self-hosted runner the job is
  # the gates, and a cancelled one stops them and reports cancelled.
  passed:
    name: all gates passed
    needs: [probe, test, gate, contract]
    if: ${{ !cancelled() || (github.event_name != 'push' && (startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-'))) }}
    runs-on: ${{ inputs.runs_on }}
    env:
      # true on a self-hosted runner, where this job runs the gates itself.
      RUN_GATES: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) }}
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.RUN_GATES == 'true' }}
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against repositories of each shape.
      - name: Find the gate module
        if: ${{ env.RUN_GATES == 'true' }}
        env:
          GATE_INPUT: ${{ inputs.gate_module }}
        run: |
          set -euo pipefail
          # A go.mod pins the tool with a line `tool <path>` or a path inside a
          # `tool ( ... )` block.
          pins_tool() {
            awk '
              /^[[:space:]]*tool[[:space:]]*\(/ { block = 1; next }
              block && /^[[:space:]]*\)/ { block = 0; next }
              block && $1 == "latere.ai/x/ci-gate/cmd/lateregate" { found = 1 }
              /^[[:space:]]*tool[[:space:]]+latere\.ai\/x\/ci-gate\/cmd\/lateregate/ { found = 1 }
              END { exit !found }
            ' "$1"
          }
          module=.
          if [ -n "$GATE_INPUT" ]; then
            module=$GATE_INPUT
          else
            cd "$GITHUB_WORKSPACE"
            if [ -f go.mod ] && pins_tool go.mod; then
              module=.
            else
              found=""
              count=0
              while IFS= read -r mod; do
                case "$mod" in go.mod | */go.mod) ;; *) continue ;; esac
                if pins_tool "$mod"; then
                  found=$(dirname "$mod")
                  count=$((count + 1))
                fi
              done < <(git ls-files '*go.mod' 'go.mod')
              if [ "$count" -gt 1 ]; then
                echo "::error title=gate module::more than one go.mod pins the tool; set gate_module to the one lateregate runs from"
                exit 1
              fi
              if [ "$count" -eq 1 ]; then module=$found; fi
            fi
          fi
          echo "lateregate runs from the module in $module"
          echo "GATE_MODULE=$module" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ env.RUN_GATES == 'true' }}
        with:
          go-version: ${{ inputs.go_version }}
          # Only a self-hosted runner gets here, and it keeps its own module
          # cache between jobs; restoring a tarball over it fails on every
          # file that exists.
          cache: false
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against canned plans.
      - name: List the running gates
        id: plan
        if: ${{ env.RUN_GATES == 'true' }}
        env:
          RUNS_ON: ${{ inputs.runs_on }}
          PROBE_RESULT: ${{ needs.probe.result }}
          BROWSER: ${{ inputs.frontend_browser_package }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::cannot write the step summary"
          }
          # The plan is measured from the last green commit. lateregate base
          # prints that commit, or nothing when the whole tree must be checked
          # and the reason on stderr. A pin that predates the command exits
          # non-zero, and so does an API or fetch error; each checks the whole
          # tree and says why, so a push is never judged on less than the bar.
          err=$(mktemp)
          base=""
          failed=false
          if out=$(go -C "$GATE_MODULE" tool lateregate base -since green -C "$GITHUB_WORKSPACE" 2>"$err"); then
            base=$(printf '%s' "$out" | tr -d '[:space:]')
          else
            failed=true
          fi
          why=$(tr '\n' ' ' < "$err" | sed 's/ *$//')
          if [ -n "$base" ]; then
            echo "The plan is measured from the last green commit $base"
            summary "The plan is measured from the last green commit $base"
            plan=$(go -C "$GATE_MODULE" tool lateregate list -json -since "$base" -C "$GITHUB_WORKSPACE")
          else
            if [ "$failed" = true ]; then
              why="lateregate base failed: ${why:-no output}"
            fi
            echo "The whole tree is checked: ${why:-no last green commit}"
            summary "The whole tree is checked: ${why:-no last green commit}"
            plan=$(go -C "$GATE_MODULE" tool lateregate list -json -C "$GITHUB_WORKSPACE")
          fi
          printf '%s\n' "$plan" | jq -r '.[] | "\(.status)\t\(.name)\t\(.reason // "")\(.until // "" | if . == "" then "" else " until " + . end)\(.into // "" | if . == "" then "" else "into " + . end)"'
          # A pin that predates needs says nothing about what a gate installs,
          # so the gates that always needed Node and Bun get them, and the
          # frontend gets the browser package the caller names.
          plan=$(printf '%s\n' "$plan" | jq -c --arg browser "$BROWSER" '
            if any(.[]; has("needs")) then .
            else map(if .name == "enum-typescript" or .name == "frontend"
              then .needs = ["node", "bun"] + (if .name == "frontend" and $browser != "" then ["chromium:" + $browser] else [] end)
              else . end)
            end')
          # Every running gate in plan order, test included: with no suite in
          # the plan this job is the test run on runs_on, and the matrix keeps
          # the other systems.
          gates=$(printf '%s\n' "$plan" | jq -c '[.[] | select(.status == "run") | .name]')
          # Every tool a running gate needs, once.
          needs=$(printf '%s\n' "$plan" | jq -c '[.[] | select(.status == "run") | (.needs // [])[]] | unique')
          # The matrix legs on other systems need the probe, which this runner
          # skips unless test_os names one. A plan that names one the probe did
          # not run for would drop that system silently, so it fails here.
          others=$(printf '%s\n' "$plan" | jq -c --arg on "$RUNS_ON" '[.[] | select(.name == "test" and (.status == "run" or .status == "folded")) | (.os // [])[] | select(. != $on)]')
          if [ "$PROBE_RESULT" = skipped ] && [ "$others" != "[]" ]; then
            echo "::error title=test_os::the plan runs test on $others, which needs the test matrix; set test_os to those systems and runs_on"
            exit 1
          fi
          {
            echo "base=$base"
            echo "gates=$gates"
            echo "needs=$needs"
          } >> "$GITHUB_OUTPUT"
      # Node and Bun when a running gate needs them, as in the gate job. A
      # failed runtime setup leaves the gate to fail on the missing tool.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ contains(fromJSON(steps.plan.outputs.needs || '[]'), 'node') }}
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ contains(fromJSON(steps.plan.outputs.needs || '[]'), 'bun') }}
        with:
          bun-version: "1.4.4"
        # bun goes to $HOME/.bun/bin. Runner slots on one machine share a
        # HOME, and a job executing bun while another slot extracts it
        # fails with ETXTBSY, so each job installs into its own temp dir.
        env:
          HOME: ${{ runner.temp }}
      # A failed install is not its own failure: the frontend gate then fails
      # on the test that needs the browser, and the other gates still report.
      # Keep in step with test/lateregate_test.sh, which runs a copy of this
      # shell against stub tools.
      - name: Install the browsers a frontend's tests drive
        if: ${{ contains(steps.plan.outputs.needs || '[]', 'chromium:') }}
        continue-on-error: true
        env:
          NEEDS: ${{ steps.plan.outputs.needs }}
        run: |
          set -uo pipefail
          failed=0
          dirs=$(printf '%s\n' "$NEEDS" | jq -r '(. // [])[] | select(startswith("chromium:")) | sub("^chromium:"; "")') || exit 1
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::chromium for $dir"
            (cd "$GITHUB_WORKSPACE/$dir" && bun install --frozen-lockfile && bunx playwright install --with-deps chromium) || failed=1
            echo "::endgroup::"
          done <<< "$dirs"
          exit "$failed"
      - name: Prepare TypeScript enum projects
        id: prepare
        if: ${{ contains(fromJSON(steps.plan.outputs.gates || '[]'), 'enum-typescript') }}
        run: go -C "$GATE_MODULE" tool lateregate enum-typescript-prepare -C "$GITHUB_WORKSPACE"
      # Keep in step with test/lateregate_test.sh, which runs a copy of this
      # loop against stub gates. It runs after a failed TypeScript setup too,
      # so the other gates still report; enum-typescript then fails unrun.
      - name: Run the gates
        id: gates
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          GATES: ${{ steps.plan.outputs.gates }}
          ENUM_SETUP: ${{ steps.prepare.outcome }}
          BASE: ${{ steps.plan.outputs.base }}
        run: |
          # A failed gate is caught where it runs and recorded, so the next one
          # still runs and one push reports every failure.
          set -euo pipefail
          # An unreadable list would leave only the wiring check to run.
          if [ -z "$GATES" ] || ! list=$(printf '%s' "$GATES" | jq -r 'if type == "array" then .[] else error("not a list") end'); then
            echo "::error title=plan::cannot read the gate list '$GATES'"
            exit 1
          fi
          summary() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::cannot write the step summary"
          }
          summary "| gate | result | seconds |"
          summary "| --- | --- | --- |"
          failed=""
          for gate in $list contract; do
            echo "::group::$gate"
            start=$SECONDS
            status=0
            if [ "$gate" = enum-typescript ] && [ "$ENUM_SETUP" != success ]; then
              echo "Node, Bun or the project install ended '$ENUM_SETUP'; the steps above say why"
              status=1
            elif [ "$gate" = lint ]; then
              # golangci-lint locks a file under TMPDIR for the whole machine; the
              # runner process's own directory keeps two slots apart.
              TMPDIR="$RUNNER_TEMP" go -C "$GATE_MODULE" tool lateregate lint -C "$GITHUB_WORKSPACE" ${BASE:+-since "$BASE"} || status=$?
            else
              # With a base, a gate that holds parts of its own skips the parts
              # the change cannot reach; an empty base passes no flag.
              go -C "$GATE_MODULE" tool lateregate "$gate" -C "$GITHUB_WORKSPACE" ${BASE:+-since "$BASE"} || status=$?
            fi
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              summary "| $gate | passed | $((SECONDS - start)) |"
            else
              summary "| $gate | **failed** | $((SECONDS - start)) |"
              failed="$failed $gate"
            fi
          done
          for gate in $failed; do
            echo "::error title=$gate::lateregate $gate failed; its output is in the $gate group of the Run the gates step"
          done
          [ -z "$failed" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (contains(fromJSON(steps.plan.outputs.gates || '[]'), 'cover') || contains(fromJSON(steps.plan.outputs.gates || '[]'), 'suite')) }}
        # Coverage remains a required gate; this report copy is optional.
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          # 7 days, as in the gate job.
          retention-days: 7
      # Keep in step with test/lateregate_test.sh, which runs a copy of this
      # check against canned results. It runs after a failed gate too, so a
      # failed test matrix is named beside it; on a hosted runner it is the
      # job's only step, and it runs in a cancelled pull request run to fail it.
      - name: Check every job's result
        if: ${{ always() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          failed=$(printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) \(.value.result)"')
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed" | while read -r job result; do
              echo "::error title=$job::job $job finished as $result; see its log"
            done
            exit 1
          fi
