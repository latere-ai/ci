name: lateregate

# Reusable per-push pipeline for a latere.ai Go repo, with nothing in it but
# the shared bar. A consumer repo calls this on every push and pull request:
#
#   on: { push: { branches: [main] }, pull_request: {} }
#   jobs:
#     gate:
#       uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
#
# Every gate lives in latere-ai/ci-gate, pinned by the consumer's go.mod as a
# tool dependency, so it runs identically on a laptop. This workflow asks the
# binary which gates apply (`lateregate list -json`) and runs one job per
# gate, so a repository adopts a gate by pinning a version that has it, not by
# editing YAML here or a Makefile there. A waived or inapplicable gate is a
# skipped job with its reason in the probe log rather than a green step over
# nothing.
#
# There is no golangci-lint version input: the binary pins it. There is no
# run_lint input: a repository that cannot lint waives `lint` in its
# .lateregate.yaml with a reason and a date, and the plan reads that.

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go toolchain version."
        required: false
        type: string
        default: "1.27"
      test_os:
        description: "JSON array of runners for the test job. Linux only by default: every service deploys on Linux, and macOS bills at ten times the Linux rate. A repository with darwin build tags or a macOS artifact adds macos-latest here."
        required: false
        type: string
        default: '["ubuntu-latest"]'
      runs_on:
        description: "Runner for every job except the test matrix: the probe, the gates and the wiring check. ubuntu-latest by default. A private repository that adopts the self-hosted linux-vm runner passes its label here and in test_os, and falls back to hosted runners by removing both lines."
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  # The plan. Its outputs are the job sets, so the jobs are exactly the gates
  # the binary will run.
  probe:
    name: which gates apply
    runs-on: ${{ inputs.runs_on }}
    env:
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
      fold: ${{ steps.plan.outputs.fold }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
      # Keep in step with test/lateregate_test.sh, which unit-tests a copy of
      # this shell against canned plans.
      - name: Read the plan
        id: plan
        env:
          HOSTED: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
          RUNS_ON: ${{ inputs.runs_on }}
          TEST_OS: ${{ inputs.test_os }}
        run: |
          set -euo pipefail
          plan=$(go tool lateregate list -json)
          printf '%s\n' "$plan" | jq -r '.[] | "\(.status)\t\(.name)\t\(.reason // "")\(.until // "" | if . == "" then "" else " until " + . end)\(.into // "" | if . == "" then "" else "into " + . end)"'
          # The gates that each run the whole test suite. suite is all of them in
          # one run; a lateregate that predates it runs them one by one.
          heavy='["suite","race","cover","tempdir","hermetic"]'
          running=$(printf '%s\n' "$plan" | jq -c '[.[] | select(.status == "run" and .name != "test") | .name]')
          # A hosted runner gives every gate a job of its own, side by side. On a
          # self-hosted runner a job is a turn on one of a few runner slots, so
          # only the suite gates get jobs and the rest share one.
          if [ "$HOSTED" = true ]; then
            gates=$running
            fold='[]'
          else
            gates=$(jq -nc --argjson r "$running" --argjson h "$heavy" '[$r[] | select(IN($h[]))]')
            fold=$(jq -nc --argjson r "$running" --argjson h "$heavy" '[$r[] | select(IN($h[]) | not)]')
          fi
          # test has its own OS matrix. When suite runs, it carries the test run on
          # runs_on, so the matrix keeps only the other systems, and they run plain
          # test rather than the instrumented suite.
          suite=$(printf '%s\n' "$plan" | jq -r '[.[] | select(.status == "run" and .name == "suite")] | length > 0')
          test=$(printf '%s\n' "$plan" | jq -r '[.[] | select(.status == "run" and .name == "test")] | length > 0')
          if [ "$suite" = true ]; then
            tests=$(jq -nc --argjson os "$TEST_OS" --arg on "$RUNS_ON" '[$os[] | select(. != $on)]')
          elif [ "$test" = true ]; then
            tests=$(jq -nc --argjson os "$TEST_OS" '$os')
          else
            tests='[]'
          fi
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "fold=$fold" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  test:
    name: test on ${{ matrix.os }}
    needs: probe
    if: ${{ needs.probe.outputs.tests != '[]' }}
    runs-on: ${{ matrix.os }}
    env:
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-') || startsWith(matrix.os, 'windows-')) && '-trimpath' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.probe.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-') || startsWith(matrix.os, 'windows-') }}
      - run: go tool lateregate test

  # One job per gate, named for it, so a failure names itself in the checks
  # list and the slow gates run beside each other: every gate on a hosted
  # runner, the suite gates alone on a self-hosted one.
  gate:
    name: ${{ matrix.gate }}
    needs: probe
    if: ${{ needs.probe.outputs.gates != '[]' }}
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.probe.outputs.gates) }}
    env:
      # A self-hosted runner keeps one Go build and test cache for all of its
      # runner processes, and without -trimpath the cache keys a package on
      # the directory it was built in. Each process checks out under a work
      # directory of its own, so none would replay a result another recorded.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
      # Enum checking resolves each configured project's TypeScript compiler.
      # Prepare its committed lockfile before checking; Go gates need neither
      # a JavaScript runtime nor a dependency install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.gate == 'enum-typescript' }}
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ matrix.gate == 'enum-typescript' }}
        with:
          bun-version: "1.3.14"
      - name: Prepare TypeScript enum projects
        if: ${{ matrix.gate == 'enum-typescript' }}
        run: go tool lateregate enum-typescript-prepare
      # Every gate but lint keeps the machine's TMPDIR. A cached test result is
      # keyed on the TMPDIR the test read, and a value per runner process
      # would keep each process from replaying what another recorded.
      - run: go tool lateregate ${{ matrix.gate }}
        if: ${{ matrix.gate != 'lint' }}
      # golangci-lint locks a file under TMPDIR for the whole machine, so lint
      # gets the runner process's own directory and two of them do not collide.
      - run: go tool lateregate lint
        if: ${{ matrix.gate == 'lint' }}
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (matrix.gate == 'cover' || matrix.gate == 'suite') }}
        # Coverage remains a required gate; this report copy is optional.
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          # 7 days. Long enough to re-run a failed release or pull the file
          # while it still matters, short enough that the store does not fill:
          # lectio's hit its quota holding 284 artifacts at the 90-day default.
          retention-days: 7

  # On a self-hosted runner the gates that take seconds share this job, and
  # the wiring check runs last in it. A job there is a turn on one of a few
  # runner slots, and with one job per gate the queue was made of job setup
  # rather than of checks. Each gate still runs whether another failed, has
  # a group of its own in the log, and is named in an annotation if it fails.
  fold:
    name: static gates and wiring
    needs: probe
    if: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) }}
    runs-on: ${{ inputs.runs_on }}
    env:
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
      # Enum checking resolves each configured project's TypeScript compiler.
      # Prepare its committed lockfile before checking; Go gates need neither
      # a JavaScript runtime nor a dependency install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ contains(fromJSON(needs.probe.outputs.fold), 'enum-typescript') }}
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ contains(fromJSON(needs.probe.outputs.fold), 'enum-typescript') }}
        with:
          bun-version: "1.3.14"
      - name: Prepare TypeScript enum projects
        if: ${{ contains(fromJSON(needs.probe.outputs.fold), 'enum-typescript') }}
        run: go tool lateregate enum-typescript-prepare
      # Keep in step with test/lateregate_test.sh, which runs a copy of this
      # loop against stub gates.
      - name: Run the gates
        env:
          GATES: ${{ needs.probe.outputs.fold }}
        run: |
          set -uo pipefail
          failed=""
          for gate in $(printf '%s' "$GATES" | jq -r '.[]') contract; do
            echo "::group::$gate"
            if [ "$gate" = lint ]; then
              # golangci-lint locks a file under TMPDIR for the whole machine; the
              # runner process's own directory keeps two slots apart.
              TMPDIR="$RUNNER_TEMP" go tool lateregate lint || failed="$failed $gate"
            else
              go tool lateregate "$gate" || failed="$failed $gate"
            fi
            echo "::endgroup::"
          done
          for gate in $failed; do
            echo "::error title=$gate::go tool lateregate $gate failed; its output is in the $gate group above"
          done
          [ -z "$failed" ]

  # The wiring check: caller, hook, gitignore, pin, no hand-rolled gate
  # target. It runs whether or not a gate fails, because the two call for
  # different work. On a self-hosted runner it runs at the end of fold.
  contract:
    name: wiring is in shape
    if: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
    runs-on: ${{ inputs.runs_on }}
    env:
      # -trimpath on a self-hosted runner: see the gate job.
      GOFLAGS: ${{ !(startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-')) && '-trimpath' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}
      - run: go tool lateregate contract
