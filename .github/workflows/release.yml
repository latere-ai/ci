name: release

# This repository holds the rule that a tag is a release and a release has
# notes, so it follows it: a v* tag publishes the GitHub release from the
# CHANGELOG.md section, through the same reusable pipeline consumers call.
# major-tag.yml moves v1 on the same push.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/notes-release.yml
    secrets: inherit
