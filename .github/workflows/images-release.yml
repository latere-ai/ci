name: images-release

# Reusable release pipeline for a latere.ai container-images repo (an
# image catalog, not a k8s service: nothing deploys). A consumer repo
# calls this on a version tag push:
#
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     release:
#       uses: latere-ai/ci/.github/workflows/images-release.yml@v1
#       with: { title: Sandbox Images }
#       secrets: inherit
#
# Flow (one run): verify -> build+push in FROM-depth stages (0..2) ->
# publish-catalog (S3) -> smoke (test.sh against the published images) ->
# release with evidence. The GitHub release publishes only after the
# smoke proves the images that were actually pushed are runnable and
# correct.
#
# Consumer conventions (see this repo's README):
#   catalog.yaml     image inventory, the single source of truth
#   catalog.sh       lint | matrix | compose, all driven by catalog.yaml
#   catalog_test.sh  tests for the catalog tooling; runs in verify
#   test.sh <tag>    runtime assertions against published images; honors
#                    RUNTIME (container runtime binary). Exits non-zero
#                    on any failed check.

on:
  workflow_call:
    inputs:
      title:
        description: "Release title prefix (e.g. Sandbox Images -> 'Sandbox Images v1.2.3')."
        required: true
        type: string
    secrets:
      CATALOG_S3_ENDPOINT:
        description: "S3-compatible endpoint URL the catalog publishes to (e.g. https://fra1.digitaloceanspaces.com)."
        required: true
      CATALOG_S3_REGION:
        description: "Region string for SigV4 signing (DO Spaces accepts us-east-1)."
        required: true
      CATALOG_S3_BUCKET:
        description: "Bucket receiving catalog.json."
        required: true
      CATALOG_S3_PREFIX:
        description: "Key prefix under the bucket (no trailing slash)."
        required: true
      CATALOG_S3_ACCESS_KEY:
        description: "Scoped access key: per-bucket grant only, it lives in a public repo's Actions."
        required: true
      CATALOG_S3_SECRET_KEY:
        description: "Secret paired with CATALOG_S3_ACCESS_KEY."
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # Lint the catalog, run the tooling tests, and derive the per-stage
  # build matrices (stage N = FROM-depth N; lint caps chains at depth 2).
  # A release builds everything: change detection is a branch-CI concern,
  # not a release concern.
  verify:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.compute.outputs.registry }}
      stage0: ${{ steps.compute.outputs.stage0 }}
      stage1: ${{ steps.compute.outputs.stage1 }}
      stage2: ${{ steps.compute.outputs.stage2 }}
      any1: ${{ steps.compute.outputs.any1 }}
      any2: ${{ steps.compute.outputs.any2 }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Reject build-metadata tags
        # docker/metadata-action sanitizes an image tag to [a-zA-Z0-9._-], so a
        # SemVer build-metadata tag (§10) would push as v1.0.0-exp-sha.5114f85
        # while the stage 1/2 BASE_IMAGE build-arg and catalog.json's refs still
        # carry the raw ref with its '+'. The FROM chain depends on image tag ==
        # git tag, so refuse the tag rather than let the two diverge silently.
        #
        # First step of the first job: nothing is built or pushed before it
        # fires.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *+*)
              echo "::error::${TAG} carries SemVer build metadata; an image tag cannot contain '+'. Cut a tag without it."
              exit 1
              ;;
          esac

      - name: Lint catalog + tooling tests
        run: |
          ./catalog.sh lint
          bash catalog_test.sh
      - name: Compute build matrices
        id: compute
        run: |
          set -euo pipefail
          matrix=$(./catalog.sh matrix --all)
          {
            echo "registry=$(jq -r '.registry' <<<"$matrix")"
            for s in 0 1 2; do
              echo "stage${s}=$(jq -c ".stages[$s]" <<<"$matrix")"
              echo "any${s}=$(jq -r ".any_stage[$s]" <<<"$matrix")"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Classify tag
        id: tag
        # A hyphen marks a prerelease only in the SemVer version core (§9).
        # Build metadata (§10, everything after '+') belongs to a stable
        # release and may itself contain hyphens, so strip it first. Computed
        # once here because the per-stage `enable=` expressions cannot strip
        # '+...' inline.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          core="${TAG%%+*}"
          if [[ "$core" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  build-stage0:
    needs: verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.stage0) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.verify.outputs.registry }}/${{ matrix.image.name }}
          # raw ref_name matches the digest-pinned ref catalog.json records;
          # latest is skipped on prereleases (v1.2.3-rc1) but not on stable
          # build-metadata tags (verify computes the flag).
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ needs.verify.outputs.stable }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digest
          jq -n --arg name '${{ matrix.image.name }}' --arg digest '${{ steps.build.outputs.digest }}' \
            '{name: $name, digest: $digest}' > "/tmp/digest/${{ matrix.image.name }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image.name }}
          path: /tmp/digest/*.json
          if-no-files-found: error

  # Stages 1 and 2 build images that FROM an image the previous stage
  # just pushed at the release ref, not :latest, so a release is
  # internally consistent even when an older release ran since the last
  # parent change.
  build-stage1:
    needs: [verify, build-stage0]
    if: ${{ needs.verify.outputs.any1 == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.stage1) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.verify.outputs.registry }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ needs.verify.outputs.stable }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.verify.outputs.registry }}/${{ matrix.image.from }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digest
          jq -n --arg name '${{ matrix.image.name }}' --arg digest '${{ steps.build.outputs.digest }}' \
            '{name: $name, digest: $digest}' > "/tmp/digest/${{ matrix.image.name }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image.name }}
          path: /tmp/digest/*.json
          if-no-files-found: error

  build-stage2:
    needs: [verify, build-stage1]
    if: ${{ always() && needs.verify.outputs.any2 == 'true' && needs.build-stage1.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.stage2) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.verify.outputs.registry }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ needs.verify.outputs.stable }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.verify.outputs.registry }}/${{ matrix.image.from }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digest
          jq -n --arg name '${{ matrix.image.name }}' --arg digest '${{ steps.build.outputs.digest }}' \
            '{name: $name, digest: $digest}' > "/tmp/digest/${{ matrix.image.name }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image.name }}
          path: /tmp/digest/*.json
          if-no-files-found: error

  # Compose catalog.json (digest-pinned refs) and publish it to object
  # storage: the current key is overwritten, the history key is immutable.
  publish-catalog:
    needs: [verify, build-stage0, build-stage1, build-stage2]
    if: >-
      ${{ always()
      && needs.build-stage0.result == 'success'
      && (needs.build-stage1.result == 'success' || needs.build-stage1.result == 'skipped')
      && (needs.build-stage2.result == 'success' || needs.build-stage2.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Compose catalog.json
        run: |
          ./catalog.sh compose "${GITHUB_REF_NAME}" "$GITHUB_SHA" digests > catalog.json
          jq . catalog.json
      - name: Upload to object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CATALOG_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOG_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CATALOG_S3_REGION }}
          ENDPOINT: ${{ secrets.CATALOG_S3_ENDPOINT }}
          BUCKET: ${{ secrets.CATALOG_S3_BUCKET }}
          PREFIX: ${{ secrets.CATALOG_S3_PREFIX }}
        run: |
          set -euo pipefail
          aws s3 cp catalog.json "s3://${BUCKET}/${PREFIX}/catalog.json" --endpoint-url "$ENDPOINT"
          aws s3 cp catalog.json "s3://${BUCKET}/${PREFIX}/history/${GITHUB_REF_NAME}.json" --endpoint-url "$ENDPOINT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-json
          path: catalog.json
          if-no-files-found: error

  # Pull the images that were actually published and run the repo's
  # runtime assertions against them. The evidence block carries the
  # digest table plus the full check output.
  smoke:
    needs: publish-catalog
    runs-on: ubuntu-latest
    outputs:
      evidence: ${{ steps.run.outputs.evidence }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: catalog-json
      - name: Smoke published images
        id: run
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          RUNTIME=docker bash test.sh "$TAG" | tee raw.txt
          mkdir -p release-evidence
          {
            echo '<!-- release-evidence -->'
            echo
            echo '## Release Evidence'
            echo
            echo "**Tag:** ${TAG} → commit \`${COMMIT}\`"
            echo "**Build:** ${BUILD_URL}"
            echo
            echo '### Published images'
            echo
            echo '| Image | Ref | Digest |'
            echo '|---|---|---|'
            jq -r '.images[] | "| \(.name) | `\(.ref)` | `\(.digest)` |"' catalog.json
            echo
            echo '### Smoke (published images)'
            echo
            echo "<details><summary>test.sh ${TAG}: all checks passed</summary>"
            echo
            echo '```text'
            sed -e 's/\x1b\[[0-9;]*m//g' raw.txt
            echo '```'
            echo
            echo '</details>'
          } > release-evidence/smoke.md
          cat release-evidence/smoke.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'evidence<<CI_EOF'
            cat release-evidence/smoke.md
            echo CI_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error

  release:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: catalog-json

      - name: Publish release with evidence
        # Generate the changelog (or reuse an existing release body), drop any
        # prior evidence block, append the fresh smoke evidence, and create or
        # edit the release with catalog.json attached. The release is the last
        # step: the registry and the published catalog are already green.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TITLE: ${{ inputs.title }}
          EVIDENCE: ${{ needs.smoke.outputs.evidence }}
        run: |
          set -euo pipefail
          marker='<!-- release-evidence -->'
          printf '%s\n' "$EVIDENCE" > evidence.md
          # A hyphen marks a prerelease only in the SemVer version core (§9);
          # build metadata (§10, after '+') is part of a stable release and
          # may itself contain hyphens, so strip it before the test.
          prerelease=""
          core="${TAG%%+*}"
          if [[ "$core" == *-* ]]; then
            prerelease="--prerelease"
          fi

          if gh release view "$TAG" --json body --jq .body > prefix.md 2>/dev/null; then
            : # existing release body becomes the prefix
          else
            gh api "repos/${GH_REPO}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > prefix.md || true
          fi

          # Drop any existing evidence block so a re-run replaces rather than
          # stacks. Everything from the marker onward is regenerated.
          awk -v m="$marker" 'index($0,m){exit} {print}' prefix.md > body.md
          { printf '\n'; cat evidence.md; } >> body.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md
            gh release upload "$TAG" catalog.json --clobber
          else
            gh release create "$TAG" $prerelease \
              --title "${TITLE} ${TAG}" \
              --notes-file body.md catalog.json
          fi
