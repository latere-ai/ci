name: probe-called
on:
  workflow_call:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: The called workflow's own coordinates
        env:
          REPO: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
          REF: ${{ job.workflow_ref }}
          CALLER_REF: ${{ github.workflow_ref }}
        run: |
          echo "job.workflow_repository=$REPO"
          echo "job.workflow_sha=$SHA"
          echo "job.workflow_ref=$REF"
          echo "github.workflow_ref=$CALLER_REF"
          test -n "$REPO" && test -n "$SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .latere-ci
          sparse-checkout: actions
          persist-credentials: false
      - run: |
          echo '/.latere-ci/' >> .git/info/exclude
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: ./.latere-ci/actions/probe-hello
