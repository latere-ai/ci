name: major-tag

# Consumers pin the moving `@v1` tag, so a release only reaches them once `v1`
# points at it. Moving that tag by hand is easy to forget: `v1` sat seven
# commits behind main while consumers silently kept building against the older
# pipeline. This moves it as part of cutting a version instead.
#
# The trigger is a `v1.*` tag push, not a push to main, on purpose. These
# workflows run in consumer repos with `contents: write`, `packages: write` and
# inherited secrets, so main stays un-canaried and cutting a version tag stays
# the deliberate human gate described in README.md under "Versioning".

on:
  push:
    tags: ["v1.*"]

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A prerelease (v1.2.3-rc1) is not something consumers should pick up by
      # pinning @v1, so only a plain vMAJOR.MINOR.PATCH tag moves it.
      - name: Is ${{ github.ref_name }} a release tag
        id: shape
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if printf '%s' "$TAG" | grep -Eq '^v1\.[0-9]+\.[0-9]+$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is a prerelease or non-standard tag; leaving v1 alone."
          fi

      # Consumers build against v1 at once, so it moves only once the tagged
      # commit passed this repository's own per-push check, the same rule
      # release.yml publishes under. This repository's shared steps are in
      # the checkout, so the check runs from there.
      - name: The tagged commit passed CI
        if: ${{ steps.shape.outputs.release == 'true' }}
        uses: ./actions/verified-commit
        with:
          verify_workflow: test.yml

      # Forward only: a backport tag pushed after a newer minor must not pull
      # v1 back, so v1 moves only to the highest release tag.
      - name: Move v1 to ${{ github.ref_name }}
        if: ${{ steps.shape.outputs.release == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/major-tag.sh
