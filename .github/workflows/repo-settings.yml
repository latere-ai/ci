name: repo-settings

# Audits every non-archived repository in the org against the settings policy
# in tools/repo-settings.json, and fails if any repo drifted. Repository
# settings are per-repo state no release pipeline touches, so a new repo
# arrives on GitHub's defaults (merge commits, rebase merges, wiki, projects)
# and silently breaks the org's squash-only history until someone notices.
#
# GITHUB_TOKEN is scoped to this repository, so the audit needs a token with
# admin rights across the org: set the REPO_ADMIN_TOKEN secret to a PAT
# carrying `repo` and `read:org`.
#
# Run `tools/repo-settings.sh apply --all` to close the drift this reports.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit org repository settings
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_ADMIN_TOKEN is not set; the audit cannot read other repositories"
            exit 1
          fi
          bash tools/repo-settings.sh check --all
