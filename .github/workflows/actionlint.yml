name: actionlint

# Lints this repo's own workflows. The reusable pipelines here cannot be run
# locally, so a static lint on every change is the first line of defense before
# a canary tag exercises them on a real consumer.

# A push or pull request that changes only specs or markdown outside the
# exception starts no run, because no workflow, action or test reads them. The
# exception is README.md, which a test holds to the runner policy it documents.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "README.md"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        # Pinned release; the action downloads the matching actionlint binary
        # and lints every workflow under .github/workflows, including the
        # reusable workflow_call definitions.
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          flags: "-color"
