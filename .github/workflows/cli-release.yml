name: cli-release

# Reusable release pipeline for a latere.ai CLI tool (no k8s deploy). A consumer
# repo calls this on a version tag push:
#
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     release:
#       uses: latere-ai/ci/.github/workflows/cli-release.yml@v1
#       secrets: inherit
#
# Flow: lint -> test -> goreleaser. goreleaser builds the cross-platform
# binaries, driven by the consumer repo's .goreleaser.yaml, and publishes the
# GitHub release whose body is the tag's CHANGELOG.md section; a tag without
# one fails before goreleaser runs.

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go toolchain version."
        required: false
        type: string
        default: "1.27"
      golangci_version:
        description: "golangci-lint version."
        required: false
        type: string
        default: "v2.13.1"
      goreleaser_version:
        description: "goreleaser version. Explicit rather than `latest` so a run cannot pick up a goreleaser build published after this workflow was reviewed."
        required: false
        type: string
        default: "v2.17.1"
      run_lint:
        description: "Run golangci-lint before release."
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run go vet + race tests before release."
        required: false
        type: boolean
        default: true
      lateregate_version:
        description: "latere-ai/ci-gate version whose `release-notes` reads the CHANGELOG.md section for the tag. Explicit rather than the consumer's tool pin so the reader is the same in every repository, including ones that pin no Go tool."
        required: false
        type: string
        default: "v0.29.0"

permissions:
  contents: write

jobs:
  lint:
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci_version }}
          args: --timeout=3m

  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          check-latest: true
      - run: go vet ./...
      - run: go test -race -timeout 120s ./...

  goreleaser:
    # Gate the release on lint + test. Both are optional jobs; `needs` on a
    # skipped job is satisfied, so disabling either still lets the release run.
    needs: [lint, test]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          check-latest: true

      - name: Read the release note for this tag
        # A tag is a release, and a release has notes. The section for this
        # tag in CHANGELOG.md is the body, and no section fails the job before
        # goreleaser builds anything. The reader is lateregate's at a version
        # pinned here, the same reader the pre-push hook refuses the tag with.
        env:
          TAG: ${{ github.ref_name }}
        run: go run latere.ai/x/ci-gate/cmd/lateregate@${{ inputs.lateregate_version }} release-notes "$TAG" > notes.md

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser_version }}
          # --release-notes replaces goreleaser's commit list with the section.
          args: release --clean --release-notes notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
