name: test

# Runs this repo's own regression suite. The reusable pipelines here cannot
# be executed locally, so the suite unit-tests copies of their inline shell
# and greps the workflows so those copies cannot silently drift.

# A push or pull request that changes only specs or markdown outside the
# exception starts no run, because no workflow, action or test reads them. The
# exception is README.md, which a test holds to the runner policy it documents.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "README.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run test suite
        run: bash test/run.sh
