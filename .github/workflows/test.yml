name: test

# Runs this repo's own regression suite. The reusable pipelines here cannot
# be executed locally, so the suite unit-tests copies of their inline shell
# and greps the workflows so those copies cannot silently drift.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run test suite
        run: bash test/run.sh
