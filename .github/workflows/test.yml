name: test

# Runs this repo's own regression suite. The reusable pipelines here cannot
# be executed locally, so the suite unit-tests copies of their inline shell
# and greps the workflows so those copies cannot silently drift.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run test suite
        run: bash test/run.sh
