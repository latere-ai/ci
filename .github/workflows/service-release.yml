name: service-release

# Reusable release pipeline for a latere.ai k8s service. A consumer repo calls
# this on a version tag push:
#
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     release:
#       uses: latere-ai/ci/.github/workflows/service-release.yml@v1
#       with: { service: platformd, image: ghcr.io/latere-ai/platformd, namespace: latere,
#               url: https://platform.latere.ai, title: Latere Platform }
#       secrets: inherit
#
# Flow (one job): build the frontend, the binary and the image -> sign the
# image and record its SBOMs -> deploy -> smoke -> release. The release
# publishes only after the live smoke proves the exact build is serving. See
# this repo's README for the consumer conventions.

on:
  workflow_call:
    inputs:
      service:
        description: "Deployment + container name, and binary name (e.g. platformd)."
        required: true
        type: string
      image:
        description: "Image path without tag (e.g. ghcr.io/latere-ai/platformd)."
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace (e.g. latere)."
        required: true
        type: string
      url:
        description: "Public production URL; also the smoke BASE_URL."
        required: true
        type: string
      title:
        description: "Release title prefix (e.g. Latere Platform -> 'Latere Platform v1.2.3')."
        required: true
        type: string
      go_version:
        description: "Go toolchain version."
        required: false
        type: string
        default: "1.27"
      bun_version:
        description: "Bun version for the frontend and CLI builds. Explicit rather than `latest` so a run cannot pick up a bun build published after this workflow was reviewed."
        required: false
        type: string
        default: "1.3.14"
      runs_on:
        description: "Runner for the job. By default the organization's runner policy picks the label (README, Runners): a private repository runs on the self-hosted runner, or on ubuntu-latest while that runner is offline; a public one on ubuntu-latest, and never on the self-hosted runner for a pull request. A label passed here overrides the policy and its fallback. The self-hosted machine ships docker, git, jq and curl and nothing else; the steps below fetch Node, kubectl and gh at pinned versions when they are missing."
        required: false
        type: string
        default: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
      kubectl_version:
        description: "kubectl release fetched for the deploy steps when the runner has none, verified against its published sha256. Hosted runners ship kubectl and skip the fetch. Keep within one minor of the cluster."
        required: false
        type: string
        default: "1.35.1"
      gh_version:
        description: "GitHub CLI release fetched for the publish step when the runner has none, verified against the release's checksums file. Hosted runners ship gh and skip the fetch."
        required: false
        type: string
        default: "2.100.0"
      cosign_version:
        description: "cosign release the image is signed with, installed and verified by sigstore/cosign-installer. Explicit so a run cannot pick up a cosign build published after this workflow was reviewed."
        required: false
        type: string
        default: "v3.0.6"
      syft_version:
        description: "syft release that writes the source and image SBOMs, installed by anchore/sbom-action through the installer at that release's tag. Explicit for the same reason as cosign_version."
        required: false
        type: string
        default: "v1.51.1"
      build_mode:
        description: "split = build frontend + Go binary in CI, then Dockerfile.ci packages the prebuilt binary (asset-hash pinned smoke). dockerfile = one Dockerfile builds everything (no asset pin; smoke proves liveness only)."
        required: false
        type: string
        default: "split"
      has_frontend:
        description: "split mode only: build the bun frontend and pin the served Vite asset hash. Ignored in dockerfile mode (the frontend builds inside the Dockerfile)."
        required: false
        type: boolean
        default: true
      frontend_dir:
        description: "Frontend directory."
        required: false
        type: string
        default: "frontend"
      deployment:
        description: "Kubernetes Deployment name. Defaults to `service` when empty."
        required: false
        type: string
        default: ""
      container:
        description: "Container name within the Deployment to set the image on. Defaults to `service` when empty."
        required: false
        type: string
        default: ""
      main_package:
        description: "Go package to build into the service binary."
        required: false
        type: string
        default: "."
      spa_embed_dir:
        description: "Path the built frontend/dist is copied into before the Go build embeds it. Empty skips the embed."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile that packages out/<service> into the runtime image."
        required: false
        type: string
        default: "Dockerfile.ci"
      rollout_timeout:
        description: "kubectl rollout status timeout."
        required: false
        type: string
        default: "180s"
      smoke_script:
        description: "Post-deploy live smoke script honoring BASE_URL/EXPECTED_ASSET/OUTPUT_MD/SERVICE_TOKEN."
        required: false
        type: string
        default: "tools/smoke/release.sh"
      preflight:
        description: "Optional shell command run after kubeconfig and before apply (e.g. a manifest preflight). Empty skips it."
        required: false
        type: string
        default: ""
      after_roll:
        description: "Optional shell command run once the Deployment has rolled, with the same kubeconfig (e.g. applying a second tree that must follow this service, and waiting for it). A failure fails the job, so neither the smoke nor the release runs. Empty skips it."
        required: false
        type: string
        default: ""
      smoke_scope:
        description: "Optional OAuth scope requested when minting the smoke token. Empty requests no scope."
        required: false
        type: string
        default: ""
      build_cli:
        description: "Also build CLI release binaries and attach them to the GitHub release (dual CLI+service repos, e.g. wallfacer)."
        required: false
        type: boolean
        default: false
      cli_build_cmd:
        description: "Command run in the repo (Go + Bun available) that produces CLI binaries under dist/. Required when build_cli is true. Keeps repo-specific ldflags/embed/matrix in the repo, not the workflow."
        required: false
        type: string
        default: ""
      lateregate_version:
        description: "latere-ai/ci-gate version whose `release-notes` reads the CHANGELOG.md section for the tag. Explicit rather than the consumer's tool pin so the reader is the same in every repository, including ones that pin no Go tool."
        required: false
        type: string
        default: "v0.29.0"
    secrets:
      DEPLOY_KUBECONFIG:
        description: "Kubeconfig of the service's rollout identity: a ServiceAccount bound to a Role in its namespace over the kinds deploy/prod and any after_roll command apply (the consumer's deploy/bootstrap/rollout-identity.yaml). A repository secret of this name reaches the pipeline through 'secrets: inherit'. Optional here so a service whose cluster side is not provisioned yet still builds and publishes its image; its deploy fails naming the secret."
        required: false
      SMOKE_BEARER:
        description: "Optional pre-minted bearer for an authenticated smoke, used verbatim. Takes precedence over SMOKE_CLIENT_ID/SECRET. Use this when the service issues its own credentials and auth holds no scope for the smoke to request."
        required: false
      SMOKE_CLIENT_ID:
        description: "Optional client_credentials id for an authenticated smoke. Repos that need it define a secret named SMOKE_CLIENT_ID; with 'secrets: inherit' it maps by name. When neither this nor SMOKE_BEARER is set the smoke runs without a bearer token."
        required: false
      SMOKE_CLIENT_SECRET:
        description: "Optional client_credentials secret paired with SMOKE_CLIENT_ID."
        required: false

permissions:
  contents: write
  packages: write
  actions: read
  # Keyless signing: cosign trades this run's OIDC token for a short-lived
  # certificate that names this workflow and the caller's repository and
  # tag. attestations is used only in a public repository (the attest steps
  # below). A caller that grants less fails before the job starts, so the
  # caller's release.yml grants both.
  id-token: write
  attestations: write

jobs:
  release:
    # One job, so a release waits for a runner once. On a busy self-hosted
    # runner each job waits for a slot of its own, and separate build,
    # deploy, smoke and publish jobs waited four times for a few minutes of
    # work. A failed step skips every step after it: nothing deploys from a
    # failed build, nothing is smoked after a failed deploy, and nothing
    # publishes after a failed smoke or CLI build. The whole job runs in the
    # production environment, so where that environment asks for an
    # approval, the approval comes before the build.
    runs-on: ${{ inputs.runs_on }}
    environment:
      name: production
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CLI build may read the tag history; the rest needs one commit.
          fetch-depth: ${{ inputs.build_cli && '0' || '1' }}

      - name: Refuse a tag that is not on the default branch
        # A tag releases what the default branch holds. A tag on a commit off
        # it would build and deploy code the branch never had: a release cut
        # whose branch push was rejected while its tag still went out, or a
        # tag pushed from a side branch. The run stops here, before anything
        # is built or pushed. The checkout above is usually one commit deep,
        # and that needs no deepening: a fetch into a shallow clone brings
        # the branch down to the tag's commit when the tag is on it, and the
        # whole branch when it is not, which is all the ancestry check reads.
        env:
          TAG: ${{ github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # Fails unless HEAD, the commit the steps below build, is reachable
          # from origin's branch $1. Keep in step with
          # test/tag_on_branch_test.sh, which runs this function from this
          # file against real clones.
          on_branch() {
            local branch=$1 rc=0
            if ! git fetch --no-tags --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "::error::cannot fetch $branch to check that $TAG is on it, so nothing was built or deployed"
              return 1
            fi
            git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch" || rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "::error::$TAG is not on $branch: its commit $(git rev-parse --short HEAD) is not reachable from origin/$branch, so nothing was built or deployed. Delete the tag with git push origin :refs/tags/$TAG, land the change on $branch, and tag a commit there."
              return 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::cannot tell whether $TAG is on $branch: git merge-base exited $rc, so nothing was built or deployed"
              return 1
            fi
          }
          on_branch "$BRANCH"
          echo "$TAG is on $BRANCH"

      - name: Refuse to roll production back
        # A re-run repeats the whole release, the build and the deploy
        # included. Once a newer version is tagged, re-running this one would
        # push its image as latest and roll the Deployment back to it, so the
        # run stops here, before anything is built or pushed. The newer tag's
        # release carries this one's changes; if this tag's notes are still
        # wanted, publish them by hand with `gh release create`.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Prints the newest vX.Y.Z tag read on stdin that is newer than
          # the version core of $1, or nothing. Prereleases on stdin are
          # ignored. Keep in step with test/rollback_guard_test.sh, which
          # runs this function from this file on a table of tags.
          newer_than() {
            local core=${1#v} newest="" t
            core=${core%%+*}
            core=${core%%-*}
            while read -r t; do
              t=${t#v}
              [[ $t =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              [ "$t" = "$core" ] && continue
              if [ "$(printf '%s\n%s\n' "$core" "$t" | sort -V | tail -n 1)" = "$t" ]; then
                if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$newest" "$t" | sort -V | tail -n 1)" = "$t" ]; then
                  newest=$t
                fi
              fi
            done
            if [ -n "$newest" ]; then
              echo "v$newest"
            fi
          }
          if ! tags=$(git ls-remote --tags --refs origin 'refs/tags/v*'); then
            echo "::error::cannot list this repository's tags to check whether a newer release exists"
            exit 1
          fi
          newer=$(printf '%s\n' "$tags" | sed 's|.*refs/tags/||' | newer_than "$TAG")
          if [ -n "$newer" ]; then
            echo "::error::$newer is tagged and newer than $TAG. Releasing $TAG now would push it as latest and roll production back to it, so nothing was built or deployed. If $TAG still needs its GitHub release, publish its CHANGELOG.md section by hand with gh release create."
            exit 1
          fi
          echo "no tag newer than $TAG"

      - name: Isolate Docker credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      # Taken from the checkout before anything is installed, so it lists
      # what the lockfiles (go.sum, bun.lock, uv.lock and the like) pin, not
      # what an install left on disk. Development packages are included:
      # they run in this job, which later holds the deploy credential. The
      # release carries the file as sbom-source.cdx.json. CycloneDX 1.6
      # rather than syft's newest, for readers that validate the version.
      - name: SBOM of the source
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json@1.6
          output-file: ${{ runner.temp }}/sbom-source.cdx.json
          syft-version: ${{ inputs.syft_version }}
          upload-artifact: false
          upload-release-assets: false
        env:
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"

      # The frontend build runs its tools (tsc, vite, prerender scripts)
      # under real Node, the runtime they are built and tested for. Without
      # it bun stands in a node shim, which is not Node: a type checker
      # under it has checked no files and reported nothing. Hosted runners
      # ship Node, the self-hosted VM does not.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ (inputs.build_mode == 'split' && inputs.has_frontend) || inputs.build_cli }}
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ (inputs.build_mode == 'split' && inputs.has_frontend) || inputs.build_cli }}
        with:
          bun-version: ${{ inputs.bun_version }}
        # bun goes to $HOME/.bun/bin. Runner slots on one machine share a
        # HOME, and a job executing bun while another slot extracts it
        # fails with ETXTBSY, so each job installs into its own temp dir.
        env:
          HOME: ${{ runner.temp }}

      - name: Install
        if: ${{ inputs.build_mode == 'split' && inputs.has_frontend }}
        run: bun install --frozen-lockfile
        working-directory: ${{ inputs.frontend_dir }}

      - name: Typecheck + build
        if: ${{ inputs.build_mode == 'split' && inputs.has_frontend }}
        run: bun run build
        working-directory: ${{ inputs.frontend_dir }}

      - name: Capture frontend build evidence
        if: ${{ inputs.build_mode == 'split' && inputs.has_frontend }}
        id: evidence
        # Pin the served bundle to the one CI just built: the hashed Vite entry
        # asset becomes EXPECTED_ASSET for the live smoke, so a stale rollout
        # that serves an old bundle fails the release.
        run: |
          set -euo pipefail
          asset=$(grep -Eo "assets/index-[^\"'<> ]+\.js" "${{ inputs.frontend_dir }}/dist/index.html" | head -1)
          if [ -z "$asset" ]; then
            echo "could not find Vite index asset in ${{ inputs.frontend_dir }}/dist/index.html" >&2
            exit 1
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"


      # Every mode needs Go: the split build, the deploy's preflight and
      # after_roll commands, and the release-note reader.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          check-latest: true
          # The module cache is worth restoring on a hosted runner, which
          # starts empty. A self-hosted runner keeps its own between jobs,
          # and restoring a tarball over it fails on every file that exists.
          cache: ${{ startsWith(inputs.runs_on, 'ubuntu-') || startsWith(inputs.runs_on, 'macos-') || startsWith(inputs.runs_on, 'windows-') }}

      - name: Embed frontend
        if: ${{ inputs.build_mode == 'split' && inputs.has_frontend && inputs.spa_embed_dir != '' }}
        run: |
          set -euo pipefail
          rm -rf "${{ inputs.spa_embed_dir }}"
          mkdir -p "${{ inputs.spa_embed_dir }}"
          cp -R "${{ inputs.frontend_dir }}/dist/." "${{ inputs.spa_embed_dir }}/"
          test -f "${{ inputs.spa_embed_dir }}/index.html"

      - name: Vet
        if: ${{ inputs.build_mode == 'split' }}
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Build shippable binary
        if: ${{ inputs.build_mode == 'split' }}
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "out/${{ inputs.service }}" "${{ inputs.main_package }}"


      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject build-metadata tags
        # docker/metadata-action sanitizes an image tag to [a-zA-Z0-9._-], so a
        # SemVer build-metadata tag (§10) would push as v1.0.0-exp-sha.5114f85
        # while `kubectl set image` below still references the raw ref with its
        # '+'. The deploy depends on image tag == git tag, so refuse the tag
        # rather than let the two diverge silently.
        #
        # This is the first step that touches a registry: nothing is pushed
        # or deployed before it fires.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *+*)
              echo "::error::${TAG} carries SemVer build metadata; an image tag cannot contain '+'. Cut a tag without it."
              exit 1
              ;;
          esac

      - name: Classify tag
        id: tag
        # A hyphen marks a prerelease only in the SemVer version core (§9).
        # Build metadata (§10, everything after '+') belongs to a stable
        # release and may itself contain hyphens, so strip it first. The
        # `enable=` expression below cannot strip '+...' inline, hence a step.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          core="${TAG%%+*}"
          if [[ "$core" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          # raw value=ref_name tags the image with the exact v-prefixed git tag
          # so `kubectl set image ...:${GITHUB_REF_NAME}` resolves with no
          # v-stripping ambiguity. latest is skipped on prereleases
          # (v1.2.3-rc1) but not on stable build-metadata tags.
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ steps.tag.outputs.stable }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERSION is consumed by dockerfile-mode images that stamp the binary
          # (e.g. wallfacer's Dockerfile.wallfacerd). Ignored by Dockerfiles that
          # don't declare ARG VERSION.
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # build-push-action uploads a *.dockerbuild build record as a run
        # artifact of its own, at the repository default. Bound it like every
        # other upload here rather than leave one unbounded uploader behind.
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 7

      # Signed by digest before anything deploys, so every image this
      # pipeline puts in production carries a signature. The signature and
      # its certificate (this workflow, the caller's repository, tag and
      # commit) are recorded in the public Sigstore log. The SBOMs are not
      # attested in a private repository: an attestation's body goes into
      # that log too, and would publish the service's dependency list.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ inputs.cosign_version }}
          # Runner slots on one machine share a HOME (see setup-bun above),
          # so each job installs into its own temp dir.
          install-dir: ${{ runner.temp }}/cosign

      - name: Sign the image
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # What the image holds: the Go modules compiled into the binary and
      # the base image's packages. The release carries it as
      # sbom-image.cdx.json.
      - name: SBOM of the image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json@1.6
          output-file: ${{ runner.temp }}/sbom-image.cdx.json
          syft-version: ${{ inputs.syft_version }}
          upload-artifact: false
          upload-release-assets: false

      # GitHub's artifact attestations need GitHub Enterprise Cloud in a
      # private repository, so only a public caller gets them. A private
      # caller has the signature above and the SBOMs on its release.
      - name: Attest the image's SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-image.cdx.json
          push-to-registry: true

      - name: Attest the image's provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Hosted runners ship kubectl; the self-hosted VM does not. The pinned
      # release is fetched with its published sha256 into a directory that
      # exists for this job alone.
      - name: Ensure kubectl
        env:
          KUBECTL_VERSION: ${{ inputs.kubectl_version }}
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
            exit 0
          fi
          dir="$RUNNER_TEMP/kubectl-bin"
          mkdir -p "$dir"
          base="https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64"
          curl -sSfL -o "$dir/kubectl" "$base/kubectl"
          curl -sSfL -o "$dir/kubectl.sha256" "$base/kubectl.sha256"
          echo "$(cat "$dir/kubectl.sha256")  $dir/kubectl" | sha256sum -c
          chmod +x "$dir/kubectl"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/kubectl" version --client

      # The kubeconfig lives in this job's temp directory, which the runner
      # empties when the job ends: on a self-hosted runner a file under $HOME
      # would outlive the job and be shared with the other slot.
      # "Drop the kubeconfig" removes it once the deploy steps are done.
      - name: Write the kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.DEPLOY_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "::error::DEPLOY_KUBECONFIG is not set on this repository. Build it from the service's rollout identity; see the latere-ai/ci README, 'Deploy credential'."
            exit 1
          fi
          install -m 700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Preflight
        if: ${{ inputs.preflight != '' }}
        run: ${{ inputs.preflight }}

      - name: Apply manifests
        # Convention: deploy/prod/ holds only re-appliable manifests. Bootstrap
        # and immutable manifests live in deploy/bootstrap/ and are ignored here.
        #
        # If deploy/prod/ is a kustomize overlay (has a kustomization.yaml),
        # apply it with -k so the base + patches render; otherwise apply the
        # raw manifest files. Backward-compatible: services with no
        # kustomization.yaml take the -f branch unchanged.
        run: |
          if [ -f deploy/prod/kustomization.yaml ]; then
            kubectl apply -k deploy/prod/
          else
            kubectl apply -f deploy/prod/
          fi

      - name: Roll new image
        # Deployment and container names default to `service` but can differ
        # (e.g. latere-ai: deployment latere-web, container latere).
        env:
          DEPLOYMENT: ${{ inputs.deployment != '' && inputs.deployment || inputs.service }}
          CONTAINER: ${{ inputs.container != '' && inputs.container || inputs.service }}
        run: |
          kubectl -n "${{ inputs.namespace }}" set image \
            "deployment/${DEPLOYMENT}" \
            "${CONTAINER}=${{ inputs.image }}:${GITHUB_REF_NAME}"
          kubectl -n "${{ inputs.namespace }}" rollout status \
            "deployment/${DEPLOYMENT}" --timeout=${{ inputs.rollout_timeout }}

      - name: After the roll
        # Runs only once the rollout above has finished, as the same rollout
        # identity, so a tree whose workloads call the new release (and
        # would ask it what the old one cannot answer) rolls second. A
        # failure fails the job: the smoke and the release are skipped and
        # the run is red, and re-running it repeats the build, the apply,
        # the roll and this step.
        if: ${{ inputs.after_roll != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.after_roll }}

      - name: Drop the kubeconfig
        # The steps after this one run the smoke script, the CLI build and
        # the note reader, none of which needs the rollout identity. Runs
        # when a deploy step failed too. KUBECONFIG names an empty file
        # rather than nothing, so kubectl cannot fall back to a config in
        # the runner's home directory.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kube"
          echo "KUBECONFIG=/dev/null" >> "$GITHUB_ENV"

      - name: Mint smoke token
        id: token
        # When smoke_client_id/secret are supplied, mint a short-lived
        # client_credentials JWT (audience = service) so the smoke can call
        # authenticated endpoints. Without them the smoke runs token-less.
        #
        # Returns early when SMOKE_BEARER holds a pre-minted token: a repo that
        # has moved to its own credential must not be held hostage by a client
        # whose grant was since revoked. HAS_BEARER carries only whether the
        # secret is set, never its value.
        env:
          HAS_BEARER: ${{ secrets.SMOKE_BEARER != '' }}
          CLIENT_ID: ${{ secrets.SMOKE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ "${HAS_BEARER:-false}" = "true" ]; then
            echo "token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${CLIENT_ID:-}" ] || [ -z "${CLIENT_SECRET:-}" ]; then
            echo "token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scope_arg=()
          if [ -n "${{ inputs.smoke_scope }}" ]; then
            scope_arg=(--data-urlencode "scope=${{ inputs.smoke_scope }}")
          fi
          response=$(curl -sS -X POST https://auth.latere.ai/token \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "audience=${{ inputs.service }}" \
            "${scope_arg[@]}")
          token=$(echo "$response" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "client_credentials mint failed: $response" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Smoke production release
        id: run
        env:
          BASE_URL: ${{ inputs.url }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          EXPECTED_ASSET: ${{ steps.evidence.outputs.asset }}
          # A pre-minted bearer wins over a client_credentials mint; the mint
          # step does not run when one is set.
          SERVICE_TOKEN: ${{ secrets.SMOKE_BEARER || steps.token.outputs.token }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          OUTPUT_MD=release-evidence/smoke.md "${{ inputs.smoke_script }}"
          cat release-evidence/smoke.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'evidence<<CI_EOF'
            cat release-evidence/smoke.md
            echo CI_EOF
          } >> "$GITHUB_OUTPUT"

      # A copy for the run's artifacts. The same text already reaches the
      # release body through the `evidence` output and the step summary, so
      # an exhausted artifact-storage quota must not fail a release whose
      # smoke has just passed.
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error
          # 7 days. Long enough to re-run a failed release or pull the file
          # while it still matters, short enough that the store does not fill:
          # lectio's hit its quota holding 284 artifacts at the 90-day default.
          retention-days: 7

      - name: Build CLI binaries
        # After the smoke, as before: a failed CLI build leaves the
        # deployed service in place and publishes no release. The
        # binaries stay in dist/ for the publish step.
        if: ${{ inputs.build_cli }}
        run: ${{ inputs.cli_build_cmd }}

      # Hosted runners ship gh; the self-hosted VM does not. The pinned
      # release is fetched and verified against its checksums file.
      - name: Ensure gh
        env:
          GH_VERSION: ${{ inputs.gh_version }}
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version | head -n1
            exit 0
          fi
          dir="$RUNNER_TEMP/gh-bin"
          mkdir -p "$dir"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$dir/$archive" "$base/$archive"
          curl -sSfL -o "$dir/checksums.txt" "$base/gh_${GH_VERSION}_checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c)
          tar -xzf "$dir/$archive" -C "$dir" --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/gh" --version | head -n1

      - name: Read the release note for this tag
        # A tag is a release, and a release has notes. The section for this
        # tag in CHANGELOG.md is the body, and no section fails the job before
        # anything is created or edited. The reader is lateregate's, run at a
        # version pinned here rather than the consumer's tool pin, so it also
        # serves repositories that pin no Go tool; the pre-push hook in a Go
        # repository refuses the tag with the same reader, so this branch is
        # rarely taken.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Gate schemas evolve independently of this pinned note reader.
          # Only the changelog at the checked-out tag is an input here.
          notes_root=$(mktemp -d)
          trap 'rm -rf "$notes_root"' EXIT
          cp CHANGELOG.md "$notes_root/CHANGELOG.md"
          go run latere.ai/x/ci-gate/cmd/lateregate@${{ inputs.lateregate_version }} release-notes -C "$notes_root" "$TAG" > notes.md

      - name: Publish release with evidence
        # The body is the changelog section, then the smoke evidence, and
        # it is rebuilt from both on every run, so an edit re-run replaces
        # rather than stacks. The release is the last step: prod is already
        # green.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ inputs.title }}
          EVIDENCE: ${{ steps.run.outputs.evidence }}
          BUILD_CLI: ${{ inputs.build_cli }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EVIDENCE" > evidence.md
          # A hyphen marks a prerelease only in the SemVer version core (§9);
          # build metadata (§10, after '+') is part of a stable release and
          # may itself contain hyphens, so strip it before the test.
          prerelease=""
          core="${TAG%%+*}"
          if [[ "$core" == *-* ]]; then
            prerelease="--prerelease"
          fi

          # The source and image SBOMs are attached to every release, and
          # CLI binaries (build_cli) beside them.
          assets=("$RUNNER_TEMP/sbom-source.cdx.json" "$RUNNER_TEMP/sbom-image.cdx.json")
          if [ "$BUILD_CLI" = "true" ]; then
            shopt -s nullglob
            cli=(dist/*)
            shopt -u nullglob
            [ ${#cli[@]} -gt 0 ] || { echo "build_cli set but dist/ is empty" >&2; exit 1; }
            assets+=("${cli[@]}")
          fi

          # Keep in step with test/publish_release_test.sh, which unit-tests
          # a copy of this line.
          { cat notes.md; printf '\n'; cat evidence.md; } > body.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "$TAG" "${assets[@]}" --clobber
            fi
          else
            # No --target: the tag already exists at $SHA, and passing
            # target_commitish makes gh attempt a ref create GITHUB_TOKEN can't
            # perform (cli/cli#9514).
            gh release create "$TAG" $prerelease \
              --title "${TITLE} ${TAG}" \
              --notes-file body.md "${assets[@]}"
          fi
