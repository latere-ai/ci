version: 2

# Every `uses:` in .github/workflows is pinned to a commit SHA so a
# repointed upstream tag cannot execute new code with this repo's
# contents:write + packages:write across every consumer. A SHA pin does not
# move on its own, so dependabot is what keeps it from going stale: it opens
# a PR per action update and rewrites the SHA plus the trailing `# vX.Y.Z`
# comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # One PR per week for the low-risk first-party set; third-party
      # actions stay separate so each gets its own review.
      trusted-actions:
        patterns:
          - "actions/*"
          - "docker/*"

# Major bumps are deliberately NOT ignored: a pipeline sitting three majors
# behind is its own risk, and a PR is the only thing that surfaces it. They
# are not merge-on-green, though. Consumers pin @v1, so a major action bump
# reaches every repo the moment that tag moves -- take it through the canary
# in README "Versioning" first, same as any other central change.
