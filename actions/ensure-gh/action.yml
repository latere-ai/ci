name: ensure-gh
description: Put the GitHub CLI on PATH, fetching the pinned release and verifying it where the runner has none.
inputs:
  version:
    description: "GitHub CLI release to fetch when the runner has none. Empty takes the version in actions/lib/versions.sh."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
