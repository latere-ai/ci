name: verified-commit
description: Refuse to release unless the tagged commit passed the repository's verify workflow on its branch push.
inputs:
  verify_workflow:
    description: "File name of the per-push workflow whose run on the tagged commit must have succeeded. Empty takes the one workflow in .github/workflows that calls lateregate.yml."
    required: false
    default: ""
  wait_minutes:
    description: "How long to wait for a verify run that is still going. 0 refuses at once, for a job on the self-hosted runner that should not hold a slot while verify runs."
    required: false
    default: "60"
  skip_paths:
    description: "Shell patterns, one per line, for paths that change no code. A commit that changes only these carries its parent's code, so where its own verify run is missing, still going or cancelled, its parent is read instead; a run that concluded on the commit still decides."
    required: false
    default: |
      specs/*
      *.md
  gh_version:
    description: "GitHub CLI release fetched where the runner has none. Empty takes the version in actions/lib/versions.sh."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_VERSION: ${{ inputs.gh_version }}
      run: bash "$GITHUB_ACTION_PATH/../ensure-gh/run.sh"
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERIFY_WORKFLOW: ${{ inputs.verify_workflow }}
        WAIT_MINUTES: ${{ inputs.wait_minutes }}
        SKIP_PATHS: ${{ inputs.skip_paths }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
