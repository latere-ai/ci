name: sign-image
description: Sign an image by digest with the workflow's identity, write its bill of materials, and attest both where the repository is public.
inputs:
  ref:
    description: "<registry>/<owner>/<name>, from image-by-digest."
    required: true
  digest:
    description: "The digest to sign, from image-by-digest."
    required: true
  sbom_dir:
    description: "Directory the bill of materials is written into, as sbom-<name>.spdx.json (or .cdx.json)."
    required: false
    default: dist
  sbom_format:
    description: "syft output format of the bill of materials."
    required: false
    default: spdx-json
  cosign_version:
    description: "cosign release. Empty takes the version in actions/lib/versions.sh."
    required: false
    default: ""
  syft_version:
    description: "syft release. Empty takes the version in actions/lib/versions.sh."
    required: false
    default: ""
outputs:
  sbom:
    description: "Path of the bill of materials."
    value: ${{ steps.sbom.outputs.path }}
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.cosign_version }}
        SYFT_VERSION: ${{ inputs.syft_version }}
      run: bash "$GITHUB_ACTION_PATH/../lib/versions.sh"
    - id: sbom
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        SBOM_DIR: ${{ inputs.sbom_dir }}
        SBOM_FORMAT: ${{ inputs.sbom_format }}
      run: bash "$GITHUB_ACTION_PATH/sbom-path.sh"
    # Runner slots on one machine share a HOME, so cosign goes into this
    # job's own temp directory.
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ steps.versions.outputs.cosign }}
        install-dir: ${{ runner.temp }}/cosign
    # Keyless: cosign trades the job's OIDC token for a short-lived
    # certificate naming the workflow and the repository, and records the
    # signature in the public Sigstore log.
    - shell: bash
      env:
        IMAGE: ${{ inputs.ref }}@${{ inputs.digest }}
      run: cosign sign --yes "$IMAGE"
    - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        image: ${{ inputs.ref }}@${{ inputs.digest }}
        format: ${{ inputs.sbom_format }}
        output-file: ${{ steps.sbom.outputs.path }}
        syft-version: ${{ steps.versions.outputs.syft }}
        upload-artifact: false
        upload-release-assets: false
    # GitHub keeps artifact attestations for a private repository only on
    # Enterprise Cloud, and an attestation's body goes into the public log,
    # so a private repository has the signature and the bill of materials
    # without them.
    - if: ${{ !github.event.repository.private }}
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-name: ${{ inputs.ref }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: ${{ steps.sbom.outputs.path }}
        push-to-registry: true
    - if: ${{ !github.event.repository.private }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.ref }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true
