# Copy to a service that publishes signed images as .github/workflows/release.yml.
# Pushing a vX.Y.Z tag whose commit passed verify.yml builds the images and
# pushes them by digest under no tag, signs them, writes their bills of
# materials and, in a public repository, attests them. Anything that must pass
# before the release is published runs between the build and the publish
# jobs, reading the digests the build outputs. The publish job tags the
# digests, signs checksums.txt over the attached files, and publishes the
# GitHub release whose body is the tag's CHANGELOG.md section. The verify job
# then checks the published release from a runner with no checkout.
#
# The deploy job is the repository's own installation: it runs only where the
# repository variable EXAMPLE_RELEASE_DEPLOY is set, so a fork that sets
# nothing publishes every artifact and skips it. It applies deploy/prod with
# the images pinned by the digests the build pushed, waits for the
# Deployments, and smokes the live service; its evidence reaches the release.
# EXAMPLE_KUBECONFIG is the repository secret holding the kubeconfig of the
# service's rollout identity (README, Deploy credential).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    # The stage reads the tagged commit's verify runs, pushes images, signs
    # them with the job's OIDC token and attests them; a calling job that
    # grants less fails before it starts.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # One image per slot, up to three. version_args is what makes the
      # image print "<name> <tag> ..."; leave it out to skip the check.
      image_1: '{"name": "exampled", "version_args": "version"}'
      # A second image built for one platform, such as test stubs:
      # image_2: '{"name": "example-stubs", "dockerfile": "Dockerfile.stubs", "platforms": "linux/amd64"}'
      # Files the release attaches beside the bills of materials:
      # archives_command: tools/release/build.sh "$TAG" dist
      # A private repository on the self-hosted runner refuses at once
      # while verify is still running rather than hold a slot:
      # wait_minutes: "0"

  # Whatever must pass before the release is published, against the digests.
  # conformance:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: ./test/conformance.sh "${{ needs.build.outputs.ref_1 }}@${{ needs.build.outputs.digest_1 }}"

  # Only with the repository variable: the cluster side is this
  # repository's own, and no fork has it. The job runs in the production
  # environment, so a required reviewer holds the run here.
  deploy:
    needs: build
    if: ${{ vars.EXAMPLE_RELEASE_DEPLOY != '' }}
    uses: latere-ai/ci/.github/workflows/image-deploy.yml@v1
    permissions:
      contents: read
    with:
      images: ${{ needs.build.outputs.images }}
      deployments: exampled
      url: https://example.latere.ai
      # The overlay and the smoke script, when they are not these:
      # deploy_dir: deploy/prod
      # smoke_script: tools/smoke/release.sh
      # A Deployment on the Recreate strategy answers late; the smoke is
      # tried again for this many seconds:
      # smoke_timeout: "120"
    secrets:
      DEPLOY_KUBECONFIG: ${{ secrets.EXAMPLE_KUBECONFIG }}

  publish:
    needs: [build, deploy]
    # deploy is skipped wherever the variable is unset, and a job that leans
    # on the implicit success() is skipped whenever a job above it is, so
    # each result is named: publish runs unless the build or the deploy
    # failed.
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      # The smoke evidence of the deploy job, appended to the release body:
      evidence: '*-evidence'
      # title: Example

  verify:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: exampled
