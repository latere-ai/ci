# Copy to a CLI repo as .github/workflows/release.yml. Requires a .goreleaser.yaml
# in the repo. Pushing a vX.Y.Z tag lints, tests, and publishes the release with
# cross-platform binaries.
name: Release

on:
  push:
    tags: ['v*']

# Required: goreleaser creates the release. The org defaults to a read-only
# token, so the calling job must grant contents: write.
permissions:
  contents: write

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/cli-release.yml@v1
    secrets: inherit
