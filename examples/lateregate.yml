# Starter caller for the shared per-push bar.
#
# Copy to your repo as .github/workflows/ci.yml, or let the binary write it:
#
#   go get -tool latere.ai/x/ci-gate/cmd/lateregate
#   go tool lateregate init
#
# Nothing else is needed. The pipeline asks lateregate which gates apply to
# your repository and runs one job per gate. `go tool lateregate` on your
# laptop runs the same set.
#
# See ci/README.md for the pipeline and ci-gate/README.md for the gates.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    # Both inputs are optional. Override only what your repo needs:
    # with:
    #   go_version: "1.27"
    #   test_os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
