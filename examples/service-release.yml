# Copy to a service repo as .github/workflows/release.yml and adjust the inputs.
# Pushing a vX.Y.Z tag builds, deploys to latere-k8s, smokes the live surface,
# and publishes the GitHub release with notes + smoke evidence.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/service-release.yml@v1
    with:
      service: luxd
      image: ghcr.io/latere-ai/luxd
      namespace: latere
      url: https://lux.latere.ai
      title: Lux
      has_frontend: true
      spa_embed_dir: internal/web/spa/dist
      main_package: ./cmd/luxd
      # preflight: go run ./tools/deploy -manifest deploy/prod/deployment.yaml -namespace sandboxd
    secrets: inherit
