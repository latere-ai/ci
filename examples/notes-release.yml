# Copy to a module or library repo as .github/workflows/release.yml. Pushing a
# vX.Y.Z tag publishes the GitHub release whose body is the tag's section in
# CHANGELOG.md; a tag without one, or on a commit whose CI did not pass,
# fails. Nothing is built or deployed.
name: Release

on:
  push:
    tags: ['v*']

# Required: the pipeline reads the tagged commit's CI runs and creates the
# release. The org defaults to a read-only token, so the calling job must
# grant contents: write and actions: read.
permissions:
  contents: write
  actions: read

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/notes-release.yml@v1
    secrets: inherit
