# Copy to a Go repository that pins latere.ai/x/ci-gate as
# .github/workflows/ci-gate-bump.yml. Once a day it moves the pin to the
# latest ci-gate release when the repository's whole bar passes on it, pushes
# `gate: ci-gate vX.Y.Z` to the branch, and runs the per-push gate on that
# commit. When the bar fails it opens one issue for the version instead and
# pushes nothing.
#
# The per-push caller needs `workflow_dispatch:` among its triggers: a push
# made with the Actions token starts no workflow, so the new commit gets its
# CI run by dispatch.
#
# A repository that pins the tool in a nested module (for example
# internal/gate, to keep it out of its consumers' module graph) needs nothing
# more: the module is found on its own. To name it instead, pass
# `with: { gate_module: internal/gate }` on the job below.
#
# Pick a minute of your own for the cron, so the repositories sharing a
# runner do not all start at once.
name: ci-gate bump

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Required: the pipeline pushes the pin, opens the issue, and dispatches the
# per-push gate. The org defaults to a read-only token.
permissions:
  contents: write
  issues: write
  actions: write

jobs:
  bump:
    uses: latere-ai/ci/.github/workflows/ci-gate-bump.yml@v1
    # The runner policy picks the runner, as it does for the per-push gate
    # (README, Runners).
